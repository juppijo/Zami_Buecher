<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPUB-Reader Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Inter:wght@400..600&display=swap">
<style>
:root {
  --bg: #10142a;
  --paper: #1a1f3d;
  --ink: #d9dcee;
  --head: #e6c88a;
  --muted: #8089b0;
  --line: rgba(255, 255, 255, 0.12);
  --shade: rgba(0, 0, 0, 0.45);
  --ui: #e6e9f7;
  --bf: Literata, Georgia, serif;
  --hf: Fraunces, Georgia, serif;
  --lh: 1.6;
  --margin-factor: 1;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-t="tag"] {
  --bg: #d9e0e6;
  --paper: #f8f9f7;
  --ink: #1d2430;
  --head: #1f4e5f;
  --muted: #6b7683;
  --line: rgba(0, 0, 0, 0.12);
  --shade: rgba(30, 45, 60, 0.28);
  --ui: #1d2430;
}
:root[data-t="sepia"] {
  --bg: #3a2f26;
  --paper: #eadfc8;
  --ink: #36291d;
  --head: #7a3b22;
  --muted: #8a7660;
  --line: rgba(0, 0, 0, 0.14);
  --shade: rgba(0, 0, 0, 0.4);
  --ui: #f0e4cc;
}
:root[data-t="oled"] {
  --bg: #000000;
  --paper: #050505;
  --ink: #e1e1e1;
  --head: #ffca28;
  --muted: #757575;
  --line: rgba(255, 255, 255, 0.2);
  --shade: rgba(0, 0, 0, 0.9);
  --ui: #ffffff;
}
:root[data-f="sans"] { --bf: Inter, system-ui, sans-serif; --hf: Inter, system-ui, sans-serif; }
:root[data-f="hyper"] { --bf: "Atkinson Hyperlegible", system-ui, sans-serif; --hf: "Atkinson Hyperlegible", system-ui, sans-serif; }
:root[data-f="classic"] { --bf: Georgia, "Times New Roman", serif; --hf: Georgia, "Times New Roman", serif; }

html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--ui);
  font: 15px/1.4 Inter, system-ui, sans-serif;
  display: grid;
  grid-template-rows: 52px 1fr 54px;
  overflow: hidden;
  transition: background 0.4s;
  height: 100dvh;
}
button, input, select { font: inherit; color: inherit; }
button {
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.2s, border-color 0.2s;
}
button:hover { background: var(--line); }
:focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }

/* Top Header Bar */
.bar, .foot { display: flex; align-items: center; gap: 8px; padding: 0 16px; transition: opacity 0.5s; z-index: 10; }
.bar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 17px Fraunces, Georgia, serif; text-align: center; color: var(--head); }
body.idle .bar, body.idle .foot { opacity: 0; pointer-events: none; }
body.zen .bar, body.zen .foot { opacity: 0; pointer-events: none; }

/* Stage & Paper */
#stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; touch-action: pan-y; -webkit-user-select: text; }
.paper { position: relative; background: var(--paper); border-radius: 6px; box-shadow: 0 30px 60px -20px var(--shade), 0 0 0 1px var(--line); transition: background 0.4s; perspective: 2600px; }
.paper.two::before { content: ""; position: absolute; inset: 0 auto 0 50%; width: 70px; margin-left: -35px; pointer-events: none; background: linear-gradient(90deg, transparent, var(--shade), transparent); opacity: 0.5; z-index: 2; }
.view { position: absolute; overflow: hidden; }

/* Dynamic Flow Content */
.flow { color: var(--ink); font-family: var(--bf); line-height: var(--lh); column-fill: auto; transition: transform 0.45s cubic-bezier(.3,.7,.2,1); hyphens: auto; -webkit-hyphens: auto; text-align: justify; }
.flow * { font-family: inherit !important; color: inherit !important; background: none !important; line-height: inherit !important; text-indent: 0 !important; max-width: 100% !important; box-sizing: border-box; }
.flow span { font-size: inherit !important; }
.flow p { margin: 0 0 0.85em !important; padding: 0 !important; font-size: 1em !important; orphans: 2; widows: 2; }
.flow p.title { font: 600 1.5em var(--hf) !important; text-align: center; color: var(--head) !important; }
.flow h1, .flow h2, .flow h3, .flow h4, .flow h5 { font-family: var(--hf) !important; color: var(--head) !important; font-weight: 600 !important; text-align: left; margin: 1.2em 0 0.6em !important; break-after: avoid; hyphens: manual; }
.flow h1 { font-size: 1.9em !important; break-before: column; } .flow h2 { font-size: 1.5em !important; break-before: column; } .flow h3 { font-size: 1.25em !important; } .flow h4, .flow h5 { font-size: 1.08em !important; }
.flow a { color: var(--head) !important; text-decoration: underline; text-underline-offset: 3px; }
.flow img { display: block; margin: 0.8em auto; width: auto; height: auto; max-height: calc(var(--H) * 0.72) !important; object-fit: contain; break-inside: avoid; border-radius: 4px; }
.flow p:has(img) { text-align: center; break-inside: avoid; }
.flow hr { display: none; } .flow li { margin-bottom: 0.4em; }

/* Page Indicators & Controls */
.fl, .fr { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav { position: absolute; top: 0; bottom: 0; width: 52px; border: 0; border-radius: 0; font-size: 32px; color: var(--muted); opacity: 0.6; z-index: 5; }
.nav:hover { background: none; opacity: 1; color: var(--head); }
#prev { left: 0; } #next { right: 0; }
#rib { position: absolute; top: 0; width: 24px; height: 38px; padding: 0; border: 0; border-radius: 0; background: var(--line); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); z-index: 4; cursor: pointer; }
#rib.on { background: var(--head); }

/* Bottom Bar */
.foot { font-size: 13px; color: var(--muted); gap: 12px; }
.foot input[type="range"] { flex: 1; accent-color: var(--head); cursor: pointer; }
.foot .ch { width: 28%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot .pg-info { min-width: 180px; text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: flex-end; }
.foot .pg-sub { font-size: 11px; opacity: 0.85; }

/* Empty / Library Overlay */
#empty { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 20px; overflow-y: auto; z-index: 50; }
.empty-box { text-align: center; max-width: 440px; margin-bottom: 30px; }
.empty-box h1 { font: 600 28px Fraunces, Georgia, serif; color: var(--head); margin: 0 0 10px; }
.empty-box p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
.drop-zone { border: 2px dashed var(--line); border-radius: 12px; padding: 30px 20px; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
.drop-zone:hover, .drop-zone.dragover { border-color: var(--head); background: rgba(255,255,255,0.03); }

/* Library Grid */
.lib-title { font: 600 20px Fraunces, Georgia, serif; color: var(--head); width: 100%; max-width: 860px; margin: 10px 0 16px; text-align: left; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; width: 100%; max-width: 860px; }
.book-card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
.book-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px var(--shade); }
.book-cover { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; background: var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
.book-card-title { font-weight: 600; font-size: 13px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
.book-card-progress { font-size: 11px; color: var(--muted); }
.book-card-del { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; border: 0; width: 24px; height: 24px; border-radius: 50%; padding: 0; display: none; }
.book-card:hover .book-card-del { display: flex; }

/* Panels & Drawers */
#toc, #side { position: fixed; top: 0; bottom: 0; background: var(--paper); color: var(--ink); z-index: 30; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 50px var(--shade); display: flex; flex-direction: column; }
#toc { left: 0; width: min(380px, 88vw); transform: translateX(-102%); padding: 56px 0 20px; }
#toc.open { transform: none; }
#toc h2 { font: 600 20px Fraunces, Georgia, serif; margin: 0 20px 12px; color: var(--head); }
#toc-search { margin: 0 16px 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; font-size: 13px; }
#tl { flex: 1; overflow-y: auto; padding: 0 12px; }
#tl a { display: block; padding: 8px 12px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 14px; line-height: 1.35; cursor: pointer; }
#tl a:hover { background: var(--line); } #tl a.cur { background: var(--line); color: var(--head); font-weight: 600; }
#toc .x, #side .x { position: absolute; top: 12px; right: 14px; font-size: 16px; width: 32px; height: 32px; }

#side { right: 0; width: min(420px, 92vw); transform: translateX(102%); padding: 16px; }
#side.open { transform: none; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { flex: 1; padding: 8px 4px; font-size: 13px; }

#sf { display: flex; gap: 6px; }
#sf input { flex: 1; min-width: 0; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
.mt { color: var(--muted); font-size: 13px; margin: 8px 0; }
.it { border-bottom: 1px solid var(--line); padding: 12px 4px; font-size: 14px; line-height: 1.45; }
.sn { cursor: pointer; } .sn b { background: rgba(120, 170, 255, 0.35); }
.it small { color: var(--muted); }
.it textarea { width: 100%; display: block; margin: 8px 0; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical; }
.it-actions { display: flex; gap: 8px; margin-top: 6px; }

#veil { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: none; opacity: 0; transition: opacity 0.3s; }
#veil.on { display: block; opacity: 1; }

/* Settings Popup */
#set { position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); right: 12px; width: min(360px, calc(100vw - 24px)); background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: 0 20px 50px var(--shade), 0 0 0 1px var(--line); padding: 12px 16px; z-index: 35; }
.row { display: flex; gap: 6px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.row > span { width: 70px; font-size: 13px; color: var(--muted); }
.row button { flex: 1; padding: 7px 4px; font-size: 12px; min-width: 60px; }
.on { background: var(--head) !important; color: var(--paper) !important; border-color: var(--head) !important; font-weight: 600; }

/* Floating Selection Menu & Search Hits */
#tb { position: fixed; z-index: 40; display: flex; gap: 6px; padding: 6px; background: var(--paper); color: var(--ink); border-radius: 12px; box-shadow: 0 10px 30px var(--shade), 0 0 0 1px var(--line); }
#tb .d { width: 34px; height: 34px; border-radius: 50%; padding: 0; }
#hit { position: fixed; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--paper); color: var(--ink); border-radius: 999px; box-shadow: 0 8px 24px var(--shade), 0 0 0 1px var(--line); z-index: 15; font-size: 13px; }

/* Highlights Styling */
::highlight(h0) { background: rgba(255, 214, 10, 0.4); }
::highlight(h1) { background: rgba(80, 200, 120, 0.4); }
::highlight(h2) { background: rgba(255, 120, 170, 0.4); }
::highlight(sr) { background: rgba(120, 170, 255, 0.38); }
::highlight(cur) { background: #ffb020; color: #111; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.c0 { background: #ffd60a; } .c1 { background: #50c878; } .c2 { background: #ff78aa; }

/* Turn Animation Leaf */
.leaf { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; z-index: 3; pointer-events: none; }
.leaf.r { transform-origin: left center; } .leaf.l { transform-origin: right center; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: var(--paper); }
.face.back { transform: rotateY(180deg); box-shadow: inset 0 0 40px var(--line); }

@media(pointer: coarse) { .nav { display: none; } }
@media(max-width: 640px) {
  .bar { padding: 0 8px; gap: 4px; }
  .bar button { padding: 8px 10px; min-height: 40px; }
  .bar button i { display: inline; font-style: normal; }
  .bar button span { display: none; }
  #set { top: auto; bottom: 0; left: 0; right: 0; width: auto; border-radius: 16px 16px 0 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .foot { padding: 0 10px; }
  .foot .ch { display: none; }
  .foot .pg-info { min-width: 100px; font-size: 11px; }
}
@media(prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
[hidden] { display: none !important; }
</style>
</head>

<script>
const $=s=>document.getElementById(s), R=document.documentElement;
let idx=0, total=1, step=1, n=2, fs=19, toc=[], key='', theme='nacht', ready=false, urls=[];
const themes=['nacht','tag','sepia','oled'];

/* LocalStorage Manager */
const store={
  get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} }
};

/* IndexedDB Database Helper for Books & Cover Caching */
class BookDB {
  constructor() {
    this.db = null;
  }
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('EpubReaderDB', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('books')) {
          db.createObjectStore('books', { keyPath: 'id' });
        }
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(); };
      req.onerror = e => reject(e);
    });
  }
  async saveBook(id, title, cover, arrayBuffer) {
    if (!this.db) await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('books', 'readwrite');
      const store = tx.objectStore('books');
      store.put({ id, title, cover, data: arrayBuffer, updated: Date.now() });
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e);
    });
  }
  async getBook(id) {
    if (!this.db) await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('books', 'readonly');
      const store = tx.objectStore('books');
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }
  async getAllBooks() {
    if (!this.db) await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('books', 'readonly');
      const store = tx.objectStore('books');
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }
  async deleteBook(id) {
    if (!this.db) await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('books', 'readwrite');
      const store = tx.objectStore('books');
      store.delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e);
    });
  }
}
const db = new BookDB();

let mode = store.get('mode') || 'auto',
    eff = store.get('eff') || 'flip',
    font = store.get('font') || 'serif',
    lh = store.get('lh') || '1.6',
    mdf = store.get('mdf') || '1',
    M = {}, hl = [], bm = [], busy = null, sel = null, TX, S = {res: [], len: 0, i: 0}, bk = '';

fs = +store.get('fs') || 19;
theme = store.get('theme') || 'nacht';
R.dataset.t = theme;
R.dataset.f = font;
R.style.setProperty('--lh', lh);
R.style.setProperty('--margin-factor', mdf);

// Reading metrics state
let sessionStartTime = Date.now();
let totalCharsReadEstimate = 0;

/* Main EPUB Parsing Function */
async function openEpub(data, titleHint = 'Buch', saveToDb = true) {
  $('empty').hidden = false;
  $('empty').innerHTML = '<b>Buch wird verarbeitet …</b><p>Struktur und Bilder werden extrahiert.</p>';
  
  try {
    const zip = await JSZip.loadAsync(data);
    const P = new DOMParser();
    const txt = p => {
      const f = zip.file(p);
      if(!f) throw new Error(`Datei in EPUB gefehlt: ${p}`);
      return f.async('string');
    };
    const res = (b, h) => {
      const u = new URL(h, 'http://x/' + b);
      return [decodeURIComponent(u.pathname.slice(1)), u.hash.slice(1)];
    };
    
    // 1. Locate OPF Manifest Container
    const contStr = await txt('META-INF/container.xml');
    const cont = P.parseFromString(contStr, 'text/xml');
    const rootEl = cont.querySelector('rootfile');
    if(!rootEl) throw new Error("Ungültiges EPUB: Container.xml besitzt keine rootfile Reference.");
    const opfP = rootEl.getAttribute('full-path');
    
    // 2. Parse OPF File
    const opfStr = await txt(opfP);
    const opf = P.parseFromString(opfStr, 'text/xml');
    
    const man = {};
    opf.querySelectorAll('manifest > item').forEach(i => {
      man[i.getAttribute('id')] = {
        p: res(opfP, i.getAttribute('href'))[0],
        pr: i.getAttribute('properties') || '',
        mt: i.getAttribute('media-type') || ''
      };
    });
    
    const spine = [...opf.querySelectorAll('spine > itemref')]
      .map(r => man[r.getAttribute('idref')])
      .filter(Boolean);
      
    const title = (opf.getElementsByTagName('dc:title')[0] || {}).textContent || titleHint;
    const lang = (opf.getElementsByTagName('dc:language')[0] || {}).textContent || 'de';

    // Extract Cover Image if available
    let coverBlobUrl = '';
    let coverArrayBuffer = null;
    const coverItem = Object.values(man).find(m => m.pr.includes('cover-image')) || 
                      Object.values(man).find(m => m.p.toLowerCase().includes('cover') && m.mt.startsWith('image/'));
    if (coverItem && zip.file(coverItem.p)) {
      const blob = await zip.file(coverItem.p).async('blob');
      coverBlobUrl = URL.createObjectURL(blob);
      if (saveToDb) {
        coverArrayBuffer = await zip.file(coverItem.p).async('arraybuffer');
      }
    }

    // Revoke old image URLs
    urls.forEach(URL.revokeObjectURL);
    urls = [];
    if(coverBlobUrl) urls.push(coverBlobUrl);
    
    const cache = {};
    const flow = $('flow');
    flow.innerHTML = '';
    flow.lang = lang.trim();
    
    let css = '';
    const docIdx = {};
    spine.forEach((s, i) => docIdx[s.p] = i);

    // 3. Extract & Scope HTML Content
    for (let i = 0; i < spine.length; i++) {
      const dStr = await txt(spine[i].p);
      const d = P.parseFromString(dStr, 'text/html');
      d.querySelectorAll('style').forEach(s => css += scope(s.textContent));
      d.querySelectorAll('script,style,link').forEach(e => e.remove());
      
      const sec = document.createElement('section');
      sec.id = 'd' + i;
      sec.innerHTML = d.body ? d.body.innerHTML : '';
      
      sec.querySelectorAll('[style]').forEach(e => e.removeAttribute('style'));
      sec.querySelectorAll('[id]').forEach(e => e.id = 'd' + i + '__' + e.id);
      sec.querySelectorAll('hr').forEach(e => e.remove());
      sec.querySelectorAll('p').forEach(p => {
        if (!p.id && !p.querySelector('img') && !p.textContent.trim()) p.remove();
      });

      // Handle Embedded Images
      for (const im of sec.querySelectorAll('img')) {
        const [path] = res(spine[i].p, im.getAttribute('src') || '');
        if (!cache[path] && zip.file(path)) {
          const b = await zip.file(path).async('blob');
          cache[path] = URL.createObjectURL(b);
          urls.push(cache[path]);
        }
        if (cache[path]) im.src = cache[path];
        im.removeAttribute('width');
        im.removeAttribute('height');
      }

      // Handle Hyperlinks
      sec.querySelectorAll('a[href]').forEach(a => {
        const h = a.getAttribute('href');
        if (/^[a-z]+:/i.test(h)) {
          a.target = '_blank';
          a.rel = 'noopener';
          return;
        }
        const [p, f] = res(spine[i].p, h);
        const t = docIdx[p];
        a.setAttribute('href', '#');
        a.dataset.go = (t === undefined) ? '' : 'd' + t + (f ? '__' + f : '');
      });

      flow.appendChild(sec);
    }

    // Append Scoped CSS
    let st = $('bookcss');
    if (!st) {
      st = document.createElement('style');
      st.id = 'bookcss';
      document.head.appendChild(st);
    }
    st.textContent = css;

    // 4. Build Table of Contents (TOC)
    toc = [];
    const nv = Object.values(man).find(m => m.pr.includes('nav'));
    if (nv) {
      const nd = P.parseFromString(await txt(nv.p), 'text/html');
      const root = nd.querySelector('nav[epub\\:type="toc"]') || nd.querySelector('nav');
      const walk = (ol, dep) => [...ol.children].forEach(li => {
        const a = li.querySelector(':scope > a, :scope > span');
        if (a) {
          const h = a.getAttribute('href');
          let id = '';
          if (h) {
            const [p, f] = res(nv.p, h), t = docIdx[p];
            if (t !== undefined) id = 'd' + t + (f ? '__' + f : '');
          }
          toc.push({ t: a.textContent.replace(/\s+/g, ' ').trim(), id, dep });
        }
        const sub = li.querySelector(':scope > ol');
        if (sub) walk(sub, dep + 1);
      });
      if (root && root.querySelector('ol')) walk(root.querySelector('ol'), 0);
    }
    
    if (!toc.length) {
      flow.querySelectorAll('h1,h2,h3').forEach(h => toc.push({
        t: h.textContent.trim(),
        id: h.id || (h.id = 'h' + toc.length),
        dep: +h.tagName[1] - 1
      }));
    }
    toc = toc.filter(x => x.t);

    key = 'pos:' + title;
    bk = title;
    $('ttl').textContent = title;
    document.title = title;
    
    $('paper').hidden = false;
    $('empty').hidden = true;

    // Save to IndexedDB Library
    if (saveToDb) {
      db.saveBook(title, title, coverArrayBuffer, data).catch(console.error);
    }

    await Promise.all([...flow.querySelectorAll('img')].map(i => i.decode().catch(() => 0)));
    
    TX = flowText();
    try {
      hl = JSON.parse(store.get('hl:' + bk) || '[]');
      bm = JSON.parse(store.get('bm:' + bk) || '[]');
    } catch(e) { hl = []; bm = []; }

    S = {res: [], len: 0, i: 0};
    $('sl').innerHTML = ''; $('sc').textContent = ''; $('q').value = '';
    ready = true;
    
    layout(+store.get(key) || 0);
    buildToc();
    paint();
    paintS();
    renderNotes();
    sessionStartTime = Date.now();

  } catch(e) {
    console.error(e);
    alert('Fehler beim Öffnen des EPUBs: ' + e.message);
    loadLibraryUI();
  }
}

function scope(css) {
  const s = document.createElement('style');
  s.textContent = css.replace(/@import[^;]+;/g, '');
  document.head.appendChild(s);
  let o = '';
  try {
    for (const r of s.sheet.cssRules) {
      if (r.type === 1 && !/^\s*(html|body)\b/.test(r.selectorText)) {
        o += r.selectorText.split(',').map(x => '.flow ' + x.trim()).join(',') + '{' + r.style.cssText + '}';
      }
    }
  } catch(e){}
  s.remove();
  return o;
}

/* Layout Engine */
function layout(frac) {
  if (!ready) return;
  if (frac === undefined) frac = idx / total;
  if (busy) busy();

  const st = $('stage'), vw = innerWidth;
  n = mode === '1' ? 1 : mode === '2' ? 2 : (vw >= 900 ? 2 : 1);
  
  const baseMargin = (vw >= 900 ? 120 : 16) * parseFloat(getComputedStyle(R).getPropertyValue('--margin-factor') || 1);
  const aw = Math.max(280, st.clientWidth - baseMargin);
  const ah = st.clientHeight - (vw >= 900 ? 20 : 8);

  let pw = Math.min(aw, n == 2 ? 1560 : 760), ph = Math.min(ah, 1100);
  const p = Math.max(vw < 640 ? 14 : 20, Math.min(56, Math.round(pw * (n == 2 ? .045 : .06)))), pt = 34, pb = 46, gap = 2 * p;
  const cw = Math.floor((pw - 2 * p - (n - 1) * gap) / n), W = n * cw + (n - 1) * gap, H = ph - pt - pb;
  
  pw = W + 2 * p;
  step = W + gap;
  M = { p, pt, W, H, pw };

  const pa = $('paper'), v = $('view'), f = $('flow');
  pa.style.width = pw + 'px'; pa.style.height = ph + 'px';
  pa.className = 'paper' + (n == 2 ? ' two' : '');
  
  v.style.cssText = `left:${p}px;top:${pt}px;width:${W}px;height:${H}px`;
  f.style.cssText = `width:${W}px;height:${H}px;column-count:${n};column-gap:${gap}px;font-size:${fs}px;--H:${H}px;transition:none;transform:none`;
  R.style.setProperty('--H', H + 'px');

  total = Math.max(1, Math.ceil((f.scrollWidth + gap - 1) / step));
  const fl = f.getBoundingClientRect().left;
  
  toc.forEach(t => {
    const e = t.id && $(t.id);
    t.pg = e ? Math.max(0, Math.floor((e.getBoundingClientRect().left - fl + 2) / step)) : 0;
  });

  $('fl').style.left = p + 'px';
  $('rib').style.right = Math.max(10, p - 12) + 'px';
  $('fr').style.cssText = n == 2 ? `right:${p}px` : 'left:0;right:0;text-align:center';
  $('fl').hidden = (n == 1);
  $('rng').max = total - 1;
  
  bm.forEach(b => b.pg = pageOf(mk(b.o, b.o + 1)));
  go(Math.round(frac * total), false);
  requestAnimationFrame(() => f.style.transition = '');
}

/* Page Navigation */
function go(i, anim = true) {
  if (busy) busy();
  const o = idx;
  idx = Math.max(0, Math.min(total - 1, i));
  const f = $('flow'), tr = `translateX(${-idx * step}px)`;

  if (anim && eff === 'flip' && n == 2 && Math.abs(idx - o) == 1 && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    turn(o, tr);
  } else {
    if (!anim) f.style.transition = 'none';
    f.style.transform = tr;
    if (!anim) requestAnimationFrame(() => f.style.transition = '');
  }

  const a = idx * n + 1;
  $('fl').textContent = a;
  $('fr').textContent = (n == 2 ? a + 1 : a);
  $('fr').hidden = (n == 2 && a + 1 > total * n);
  $('rng').value = idx;

  // Percentage & Reading speed estimate
  const pct = Math.round(((idx + 1) / total) * 100);
  const totalChars = TX ? TX.len : 100000;
  const charsPerSec = 25; // Average adult reading speed (~250 wpm)
  const remainingChars = Math.max(0, totalChars * (1 - (idx + 1) / total));
  const remainingMins = Math.ceil(remainingChars / (charsPerSec * 60));

  $('pg').textContent = n == 2 ? `Seiten ${a}–${a + 1} von ${total * 2}` : `Seite ${a} von ${total}`;
  $('pgSub').textContent = `${pct}% gelesen · ca. ${remainingMins} Min. verbleibend`;

  let cur = -1;
  toc.forEach((t, k) => { if (t.pg <= idx && t.id) cur = k; });
  $('ch').textContent = cur >= 0 ? toc[cur].t : '';
  
  document.querySelectorAll('#tl a').forEach((x, k) => x.classList.toggle('cur', k === cur));
  $('prev').style.visibility = idx ? '' : 'hidden';
  $('next').style.visibility = idx < total - 1 ? '' : 'hidden';
  $('rib').classList.toggle('on', bm.some(b => b.pg === idx));
  
  store.set(key, idx / total);
}

function buildToc() {
  const tl = $('tl');
  tl.innerHTML = '';
  toc.forEach((t, k) => {
    const a = document.createElement('a');
    a.textContent = t.t;
    a.style.paddingLeft = (12 + t.dep * 16) + 'px';
    a.onclick = () => { jump(t.id); openToc(false); };
    tl.appendChild(a);
  });
  go(idx, false);
}

// TOC Search Filter
$('toc-search').oninput = e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#tl a').forEach((a, i) => {
    const match = toc[i].t.toLowerCase().includes(q);
    a.style.display = match ? 'block' : 'none';
  });
};

function jump(id) {
  const e = id && $(id);
  if (!e) { go(0); return; }
  const f = $('flow');
  const t = f.style.transform;
  f.style.transition = 'none';
  f.style.transform = 'none';
  const x = e.getBoundingClientRect().left - f.getBoundingClientRect().left;
  f.style.transform = t;
  requestAnimationFrame(() => f.style.transition = '');
  go(Math.floor((x + 2) / step));
}

function openToc(o) {
  $('toc').classList.toggle('open', o);
  $('veil').classList.toggle('on', o);
  if (o) {
    const c = document.querySelector('#tl a.cur');
    if (c) c.scrollIntoView({ block: 'center' });
  }
}

async function fsToggle() {
  try {
    document.fullscreenElement ? await document.exitFullscreen() : await R.requestFullscreen();
  } catch(e) {
    document.body.classList.toggle('fsx');
    wake();

}

const setFs = d => { fs = Math.max(14, Math.min(32, fs + d)); store.set('fs', fs); layout(); };

/* Selection & Annotations Helper Functions */
const E = (t, a = {}, ...k) => { const e = document.createElement(t); Object.assign(e, a); e.append(...k); return e; };
const HLA = window.CSS && CSS.highlights;

function flowText() {
  const w = document.createTreeWalker($('flow'), 4), a = [];
  let o = 0, nd, s = '';
  while(nd = w.nextNode()) {
    a.push({ nd, o });
    o += nd.length;
    s += nd.data;
  }
  return { a, len: o, s, m: new Map(a.map(x => [x.nd, x.o])) };
}

function at(o) {
  let lo = 0, hi = TX.a.length - 1;
  while(lo < hi) {
    const m = (lo + hi + 1) >> 1;
    if (TX.a[m].o <= o) lo = m; else hi = m - 1;
  }
  return [TX.a[lo].nd, Math.min(TX.a[lo].nd.length, o - TX.a[lo].o)];
}

function mk(s, e) {
  const r = document.createRange();
  r.setStart(...at(s));
  r.setEnd(...at(e));
  return r;
}

function off(n, k, end) {
  if (n.nodeType !== 3) {
    const c = end ? (n.childNodes[k - 1] || n) : (n.childNodes[k] || n);
    let t = null;
    if (c.nodeType === 3) t = c;
    else {
      const w = document.createTreeWalker(c, 4);
      let x;
      if (end) { while(x = w.nextNode()) t = x; } else t = w.nextNode();
    }
    if (!t) return end ? 0 : TX.len;
    return TX.m.get(t) + (end ? t.length : 0);
  }
  return TX.m.get(n) + k;
}

function caretAt(x, y) {
  let n = null, k = 0;
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    if (p) { n = p.offsetNode; k = p.offset; }
  } else if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    if (r) { n = r.startContainer; k = r.startOffset; }
  }
  return n && $('flow').contains(n) ? [n, k] : null;
}

function pageOf(r) {
  const c = r.getClientRects()[0];
  return c ? Math.max(0, Math.floor((c.left - $('flow').getBoundingClientRect().left + 2) / step)) : idx;
}

function showAt(s, e, close) {
  go(pageOf(mk(s, e)));
  if (close) closeAll();
}

const snip = (s, e) => TX.s.slice(s, e).replace(/\s+/g, ' ').trim().slice(0, 160);
const save = () => {
  store.set('hl:' + bk, JSON.stringify(hl));
  store.set('bm:' + bk, JSON.stringify(bm));
};

function paint() {
  if (!HLA || !TX) return;
  for (let c = 0; c < 3; c++) {
    HLA.set('h' + c, new Highlight(...hl.filter(h => h.c == c).map(h => mk(h.s, h.e))));
  }
}

function paintS() {
  const h = $('hit');
  if (HLA) {
    HLA.set('sr', new Highlight(...S.res.map(o => mk(o, o + S.len))));
    HLA.delete('cur');
    if (S.res.length) HLA.set('cur', new Highlight(mk(S.res[S.i], S.res[S.i] + S.len)));
  }
  h.hidden = !S.res.length;
  $('hc').textContent = `${S.i + 1} / ${S.res.length}`;
}

function hitGo(k) {
  if (!S.res.length) return;
  S.i = ((k % S.res.length) + S.res.length) % S.res.length;
  go(pageOf(mk(S.res[S.i], S.res[S.i] + S.len)));
  paintS();
}

function doSearch(q) {
  S = {res: [], len: 0, i: 0};
  const L = $('sl');
  L.innerHTML = '';
  if (q.length < 2) {
    $('sc').textContent = 'Bitte mindestens 2 Zeichen eingeben.';
    paintS();
    return;
  }
  const s = TX.s.toLowerCase(), t = q.toLowerCase();
  S.len = t.length;
  for (let i = s.indexOf(t); i >= 0 && S.res.length < 1000; i = s.indexOf(t, i + t.length)) {
    S.res.push(i);
  }
  $('sc').textContent = S.res.length ? `${S.res.length >= 1000 ? '1000+' : S.res.length} Treffer` : 'Keine Treffer.';
  
  S.res.slice(0, 200).forEach((o, k) => {
    const d = E('div', {className: 'it sn', onclick: () => { hitGo(k); closeAll(); }},
      '…' + TX.s.slice(Math.max(0, o - 35), o).replace(/\s+/g, ' '),
      E('b', {textContent: TX.s.slice(o, o + S.len)}),
      TX.s.slice(o + S.len, o + S.len + 45).replace(/\s+/g, ' ') + '…'
    );
    L.append(d);
  });
  paintS();
}

function pageStart() {
  const fl = $('flow').getBoundingClientRect().left, lo = idx * step - 2;
  for (const x of TX.a) {
    if (!/\S/.test(x.nd.data)) continue;
    const r = document.createRange();
    r.selectNodeContents(x.nd);
    const c = r.getClientRects()[0];
    if (c && c.left - fl >= lo) return x.o;
  }
  return 0;
}

function toggleBm() {
  if (!ready) return;
  const ex = bm.filter(b => b.pg === idx);
  if (ex.length) bm = bm.filter(b => !ex.includes(b));
  else {
    const o = pageStart();
    bm.push({ o, pg: idx, t: snip(o, o + 110), ch: $('ch').textContent, d: Date.now() });
  }
  save();
  $('rib').classList.toggle('on', bm.some(b => b.pg === idx));
  renderNotes();
}

function renderNotes() {
  const nl = $('nl'), bl = $('bl');
  nl.innerHTML = ''; bl.innerHTML = '';
  
  if (!hl.length) nl.append(E('p', {className: 'mt', textContent: 'Text im Buch markieren und eine Farbe oder „Notiz" wählen.'}));
  [...hl].sort((a, b) => a.s - b.s).forEach(h => {
    const ta = E('textarea', {value: h.n || '', placeholder: 'Notiz hinzufügen …', rows: 2, id: 'n' + h.id});
    ta.oninput = () => { h.n = ta.value; save(); };
    
    nl.append(E('div', {className: 'it'},
      E('div', {className: 'sn', onclick: () => showAt(h.s, h.e, true)},
        E('span', {className: 'dot c' + h.c}), ' ' + snip(h.s, h.e)
      ),
      ta,
      E('div', {className: 'it-actions'},
        E('button', {textContent: 'Löschen', onclick: () => { hl = hl.filter(x => x !== h); save(); paint(); renderNotes(); }})
      )
    ));
  });

  if (!bm.length) bl.append(E('p', {className: 'mt', textContent: 'Noch keine Lesezeichen gesetzt.'}));
  [...bm].sort((a, b) => a.o - b.o).forEach(b => {
    bl.append(E('div', {className: 'it'},
      E('div', {className: 'sn', onclick: () => showAt(b.o, b.o + 1, true)},
        E('small', {textContent: (b.ch ? b.ch + ' · ' : '') + 'Seite ' + (b.pg * n + 1)}),
        E('br'), b.t
      ),
      E('div', {className: 'it-actions'},
        E('button', {textContent: 'Entfernen', onclick: () => { bm = bm.filter(x => x !== b); save(); go(idx, false); renderNotes(); }})
      )
    ));
  });
}

// Export / Import Highlights & Bookmarks JSON
$('expNotes').onclick = () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bk, hl, bm }, null, 2));
  const a = document.createElement('a');

  a.setAttribute("download", `Notizen_${bk.replace(/\s+/g, '_')}.json`);
  document.body.appendChild(a);

};
$('impNotes').onclick = () => $('impNotesFile').click();
$('impNotesFile').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.hl) hl = parsed.hl;
      if (parsed.bm) bm = parsed.bm;
      save(); paint(); renderNotes();
      alert('Notizen erfolgreich importiert.');
    } catch(err) {
      alert('Ungültiges Notizen-Dateiformat.');
    }
  };
  reader.readAsText(file);
};

function openSide(tab, id) {
  if (!ready) return;
  closeAll();
  $('side').classList.add('open');
  $('veil').classList.add('on');
  for (const k of ['s', 'b', 'n']) $('p' + k).hidden = (k !== tab);
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  renderNotes();
  if (tab === 's') $('q').focus();
  if (id) {
    const ta = $('n' + id);
    if (ta) { ta.scrollIntoView({ block: 'center' }); ta.focus(); }
  }
}

function closeAll() {
  openToc(false);
  $('side').classList.remove('open');
  $('set').hidden = true;
  $('veil').classList.remove('on');
}

function selUI() {
  const s = getSelection(), tb = $('tb');
  if (!ready || !s.rangeCount || s.isCollapsed || !$('flow').contains(s.anchorNode) || !$('flow').contains(s.focusNode)) {
    tb.hidden = true;
    return;
  }
  const r = s.getRangeAt(0), rc = r.getClientRects()[0];
  if (!rc) { tb.hidden = true; return; }
  sel = [off(r.startContainer, r.startOffset), off(r.endContainer, r.endOffset, 1)];
  tb.hidden = false;
  tb.style.left = Math.max(8, Math.min(innerWidth - tb.offsetWidth - 8, rc.left)) + 'px';
  tb.style.top = (rc.top > 70 ? rc.top - 52 : rc.bottom + 12) + 'px';
}

function addHl(c, note) {
  if (!sel) return;
  const h = { id: Date.now(), s: Math.min(...sel), e: Math.max(...sel), c, n: '' };
  if (h.e - h.s < 1) return;
  hl.push(h);
  save();
  paint();
  getSelection().removeAllRanges();
  $('tb').hidden = true;
  renderNotes();
  if (note) openSide('n', h.id);
}

let stt;
document.addEventListener('selectionchange', () => { clearTimeout(stt); stt = setTimeout(selUI, 250); });
$('tb').onpointerdown = e => e.preventDefault();
$('tb').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.c) addHl(+b.dataset.c);
  else addHl(0, true);
};

/* 3D Page Turn Animation */
function turn(o, tr) {
  const d = idx > o ? 1 : -1, { p, pt, W, H, pw } = M, f = $('flow');
  const L = E('div', { className: 'leaf ' + (d > 0 ? 'r' : 'l') });
  L.style.cssText = `left:${d > 0 ? pw / 2 : 0}px;width:${pw / 2}px`;
  
  const fr = E('div', { className: 'face' }), v = E('div', { className: 'view' }), bkf = E('div', { className: 'face back' });
  v.style.cssText = `left:${d > 0 ? p - pw / 2 : p}px;top:${pt}px;width:${W}px;height:${H}px`;
  
  const c = f.cloneNode(true);
  c.removeAttribute('id');
  c.style.transition = 'none';
  c.style.transform = `translateX(${-o * step}px)`;
  
  v.append(c); fr.append(v); L.append(fr, bkf); $('paper').append(L);
  
  const A = L.animate([{ transform: 'rotateY(0deg)' }, { transform: `rotateY(${-180 * d}deg)` }], { duration: 600, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' });
  fr.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(.8)' }], { duration: 300, fill: 'forwards' });
  bkf.animate([{ filter: 'brightness(.8)' }, { filter: 'brightness(1)' }], { duration: 600 });
  
  const snap = () => {
    f.style.transition = 'none';
    f.style.transform = tr;
    requestAnimationFrame(() => f.style.transition = '');
  };
  const t = setTimeout(snap, 300);
  busy = () => { clearTimeout(t); snap(); L.remove(); busy = null; };
  A.onfinish = () => { if (busy) { L.remove(); busy = null; } };
}

function sync() {
  document.querySelectorAll('#set button[data-f],#set button[data-m],#set button[data-e],#set button[data-t],#set button[data-lh],#set button[data-mdf]').forEach(b => {
    const d = b.dataset;
    b.classList.toggle('on', d.f ? d.f === font : d.m ? d.m === mode : d.e ? d.e === eff : d.t ? d.t === theme : d.lh ? d.lh === lh : d.mdf === mdf);
  });
}

$('set').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.f) { font = d.f; R.dataset.f = font; store.set('font', font); layout(); }
  else if (d.m) { mode = d.m; store.set('mode', mode); layout(); }
  else if (d.e) { eff = d.e; store.set('eff', eff); }
  else if (d.t) { theme = d.t; R.dataset.t = theme; store.set('theme', theme); }
  else if (d.lh) { lh = d.lh; R.style.setProperty('--lh', lh); store.set('lh', lh); layout(); }
  else if (d.mdf) { mdf = d.mdf; R.style.setProperty('--margin-factor', mdf); store.set('mdf', mdf); layout(); }
  else if (b.id === 'sm') setFs(-1);
  else if (b.id === 'sp') setFs(1);
  sync();
};

$('bSet').onclick = e => { const o = $('set').hidden; closeAll(); $('set').hidden = !o; sync(); };
document.addEventListener('click', e => { if (!$('set').hidden && !e.target.closest('#set,#bSet')) $('set').hidden = true; });

$('bSearch').onclick = () => openSide('s');
$('bNotes').onclick = () => openSide('n');
$('bLib').onclick = () => showLibrary();
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => openSide(b.dataset.tab));
$('sX').onclick = closeAll;
$('sf').onsubmit = e => { e.preventDefault(); if (ready) doSearch($('q').value.trim()); };
$('addBm').onclick = toggleBm;
$('rib').onclick = toggleBm;
$('hp').onclick = () => hitGo(S.i - 1);
$('hn').onclick = () => hitGo(S.i + 1);
$('hx').onclick = () => { S = {res: [], len: 0, i: 0}; paintS(); };

sync();
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
$('rng').oninput = e => go(+e.target.value);
$('bToc').onclick = () => { closeAll(); openToc(true); };
$('bX').onclick = $('veil').onclick = closeAll;
$('bFs').onclick = fsToggle;

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (f) openEpub(await f.arrayBuffer(), f.name.replace(/\.epub$/i, ''));
};
$('flow').onclick = e => {
  const a = e.target.closest('a[data-go]');
  if (a) { e.preventDefault(); jump(a.dataset.go); }
};

/* Drag and Drop Handler */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.epub')) openEpub(await f.arrayBuffer(), f.name.replace(/\.epub$/i, ''));
});

/* Keyboard Navigation */
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') go(idx + 1);
  else if (k === 'ArrowLeft' || k === 'PageUp') go(idx - 1);
  else if (k === 'Home') go(0);
  else if (k === 'End') go(total - 1);
  else if (k === 'f' || k === 'F') fsToggle();
  else if (k === 't' || k === 'T') openToc(!$('toc').classList.contains('open'));
  else if (k === 'Escape') closeAll();
  else if (k === '+') setFs(1);
  else if (k === '-') setFs(-1);
  else if (k === 'b' || k === 'B') toggleBm();
  else if (k === '/') { e.preventDefault(); openSide('s'); }
  else return;
  if (k === ' ') e.preventDefault();
});

/* Gesture & Pointer Handler */
let sx = 0, sy = 0;
$('stage').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
$('stage').addEventListener('pointerup', e => {
  if (e.target.closest('button,a,textarea,#tb')) return;
  const dx = e.clientX - sx, dy = e.clientY - sy, s = getSelection();
  if (e.pointerType !== 'mouse' && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    go(idx + (dx < 0 ? 1 : -1));
    return;
  }
  if (Math.hypot(dx, dy) > 10 || (s && !s.isCollapsed) || !ready) return;
  const c = caretAt(e.clientX, e.clientY);
  if (c) {
    const o = off(c[0], c[1]), h = hl.find(h => o >= h.s && o < h.e);
    if (h) { openSide('n', h.id); return; }
  }
  if (e.pointerType === 'mouse') return;
  const r = $('paper').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < 0.3) go(idx - 1);
  else if (x > 0.7) go(idx + 1);
  else document.body.classList.toggle('zen');
});

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => layout(), 120); });

let it;
const wake = () => {
  document.body.classList.remove('idle');
  clearTimeout(it);
  if (document.fullscreenElement || document.body.classList.contains('fsx')) {
    it = setTimeout(() => document.body.classList.add('idle'), 3000);
  }
};
addEventListener('mousemove', wake);
addEventListener('keydown', wake);

/* IndexedDB Library UI Manager */
async function loadLibraryUI() {
  const books = await db.getAllBooks();
  const grid = $('libGrid');
  grid.innerHTML = '';
  
  if (!books.length) {
    $('libHeader').hidden = true;
    return;
  }
  
  $('libHeader').hidden = false;
  books.sort((a,b) => (b.updated || 0) - (a.updated || 0)).forEach(b => {
    const card = E('div', { className: 'book-card', onclick: () => openEpub(b.data, b.title, false) });
    let coverEl;
    if (b.cover) {
      const url = URL.createObjectURL(new Blob([b.cover]));
      urls.push(url);
      coverEl = E('img', { className: 'book-cover', src: url });
    } else {
      coverEl = E('div', { className: 'book-cover', textContent: b.title });
    }
    
    const pos = store.get('pos:' + b.id);
    const pct = pos ? Math.round(parseFloat(pos) * 100) : 0;

    const delBtn = E('button', {
      className: 'book-card-del',
      textContent: '✕',
      onclick: async (e) => {
        e.stopPropagation();
        if (confirm(`"${b.title}" aus Bibliothek löschen?`)) {
          await db.deleteBook(b.id);
          loadLibraryUI();
        }
      }
    });

    card.append(
      coverEl,
      E('div', { className: 'book-card-title', textContent: b.title }),
      E('div', { className: 'book-card-progress', textContent: `${pct}% gelesen` }),
      delBtn
    );
    grid.append(card);
  });
}

function showLibrary() {
  ready = false;
  $('paper').hidden = true;
  $('empty').hidden = false;
  $('ttl').textContent = 'EPUB-Reader';
  closeAll();
  loadLibraryUI();
}

// Initial Loading Setup
db.init().then(() => loadLibraryUI()).catch(console.error);
document.fonts && document.fonts.ready.then(() => { if (ready) layout(); });
</script>
