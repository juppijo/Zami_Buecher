<!DOCTYPE html>

    <title>Bildergalerie</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .gallery-item {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            padding: 10px;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        .gallery-item p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
