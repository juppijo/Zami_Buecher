<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bilderbuch Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:'Bebas Neue', sans-serif;
  --font-body:'Barlow', sans-serif;
}
html[data-theme="leder"]{
  --bg1:#120d0a; --bg2:#1e1611; --frame:#241a13; --frame2:#3a2a1c;
  --paper:#f4ead4; --paper2:#e9dcbf; --spine:#0a0704;
  --accent:#d4af37; --accent-dim:#9c7f2b; --text:#f4ead4; --muted:#c9b98f;
  --shadow: rgba(0,0,0,.65);
}
html[data-theme="antik"]{
  --bg1:#2c2117; --bg2:#3c2e1f; --frame:#4a3620; --frame2:#5f4527;
  --paper:#efe1c3; --paper2:#e3d1a8; --spine:#1c130b;
  --accent:#b5793a; --accent-dim:#8a5c2a; --text:#f1e6cc; --muted:#d8c6a0;
  --shadow: rgba(20,10,0,.55);
}
html[data-theme="modern"]{
  --bg1:#0a0a0c; --bg2:#131318; --frame:#1a1b20; --frame2:#26272e;
  --paper:#f6f6f8; --paper2:#eaeaee; --spine:#000;
  --accent:#c9c9d6; --accent-dim:#84848f; --text:#f2f2f5; --muted:#9a9aa5;
  --shadow: rgba(0,0,0,.7);
}
html[data-theme="nacht"]{
  --bg1:#000; --bg2:#08080a; --frame:#0e0e10; --frame2:#161618;
  --paper:#141412; --paper2:#0f0f0e; --spine:#000;
  --accent:#b8860b; --accent-dim:#7a5a09; --text:#e7d9b0; --muted:#8c7f5e;
  --shadow: rgba(0,0,0,.85);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font-body);
  background:radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg1) 75%);
  color:var(--text);
  display:flex; flex-direction:column;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
}

/* ---------- Toolbar ---------- */
#toolbar{
  display:flex; align-items:center; gap:14px;
  padding:10px 18px;
  background:linear-gradient(180deg, var(--frame2), var(--frame));
  border-bottom:2px solid var(--accent-dim);
  flex-wrap:wrap;
  z-index:50;
  transition:transform .35s ease, opacity .35s ease;
}
body.fs-hide #toolbar{ transform:translateY(-110%); opacity:0; pointer-events:none; }
body.reader-mode #toolbar{ display:none !important; }
body.reader-mode #stageWrap{ padding-top:26px; }

h1#logo{
  font-family:var(--font-display);
  letter-spacing:2px;
  font-size:22px;
  color:var(--accent);
  margin:0 8px 0 0;
  white-space:nowrap;
}
.grp{ display:flex; align-items:center; gap:6px; padding:0 8px; border-right:1px solid rgba(255,255,255,.08); }
.grp:last-child{ border-right:none; }
label.small{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-right:2px; }

button, select{
  font-family:var(--font-body); font-weight:600; font-size:13px;
  background:linear-gradient(180deg, var(--frame2), var(--frame));
  color:var(--text);
  border:1px solid var(--accent-dim);
  border-radius:6px;
  padding:7px 12px;
  cursor:pointer;
  transition:background .2s, transform .1s, border-color .2s;
  white-space:nowrap;
}
button:hover{ border-color:var(--accent); background:linear-gradient(180deg, var(--frame2), var(--frame2)); }
button:active{ transform:scale(.96); }
button.active{ background:var(--accent); color:var(--spine); border-color:var(--accent); }
button:disabled{ opacity:.35; cursor:default; }
select{ padding:7px 8px; }

.swatch{ width:26px; height:26px; padding:0; border-radius:50%; border:2px solid var(--accent-dim); position:relative; }
.swatch.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
.sw-leder{ background:linear-gradient(135deg,#3a2a1c,#f4ead4 60%,#d4af37); }
.sw-antik{ background:linear-gradient(135deg,#5f4527,#efe1c3 60%,#b5793a); }
.sw-modern{ background:linear-gradient(135deg,#1a1b20,#f6f6f8 60%,#c9c9d6); }
.sw-nacht{ background:linear-gradient(135deg,#000,#141412 55%,#b8860b); }

#folderInfo{ font-size:12px; color:var(--muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- Stage ---------- */
#stageWrap{
  flex:1; position:relative; display:flex; align-items:center; justify-content:center;
  padding:22px; min-height:0;
}
#dropHint{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; color:var(--muted); text-align:center; padding:20px;
}
#dropHint h2{ font-family:var(--font-display); letter-spacing:1px; color:var(--accent); font-weight:400; font-size:28px; margin:0; }
#dropHint.hidden{ display:none; }

#book{
  position:relative;
  perspective:2400px;
  width:min(92vw, 1180px);
  height:min(78vh, 760px);
  display:flex; align-items:stretch; justify-content:center;
}
#book.hidden{ display:none; }

#frame{
  position:relative; width:100%; height:100%;
  background:linear-gradient(180deg, var(--frame2), var(--frame));
  border-radius:10px;
  box-shadow:0 30px 70px var(--shadow), inset 0 0 0 2px var(--accent-dim);
  padding:22px;
  display:flex;
}

#pages{
  position:relative; flex:1; display:flex; border-radius:4px; overflow:hidden;
  box-shadow: inset 0 0 40px rgba(0,0,0,.35);
  background:var(--paper2);
}

.pageHalf{
  position:relative; flex:1; height:100%; background:var(--paper);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.pageHalf img{ width:100%; height:100%; object-fit:contain; background:var(--paper); }
.pageHalf.blank::before{
  content:"◆"; color:var(--accent-dim); font-size:22px; opacity:.4;
}
#pages.mode-single .pageHalf, #pages.mode-span .pageHalf{ flex:1; }

/* spine shadow */
#gutter{
  position:absolute; top:0; bottom:0; left:50%; width:36px; transform:translateX(-50%);
  background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 50%, rgba(0,0,0,0) 100%);
  pointer-events:none; z-index:5;
}
#pages.mode-single #gutter{ display:none; }

/* outer page edge shading */
#pages::before, #pages::after{
  content:""; position:absolute; top:0; bottom:0; width:14px; z-index:4; pointer-events:none;
}
#pages::before{ left:0; background:linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0)); }
#pages::after{ right:0; background:linear-gradient(270deg, rgba(0,0,0,.18), rgba(0,0,0,0)); }

/* flip leaf */
.leaf{
  position:absolute; top:0; bottom:0; left:0; width:100%; height:100%;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  z-index:10;
  background:var(--paper);
  box-shadow:0 0 40px rgba(0,0,0,.4);
}
.leaf .leafInner{ position:absolute; inset:0; display:flex; }
.leaf.animating{ transition:transform .68s cubic-bezier(.45,.05,.2,1); }

/* nav click zones */
.navZone{ position:absolute; top:0; bottom:0; width:50%; cursor:pointer; z-index:20; }
.navZone.left{ left:0; } .navZone.right{ right:0; }
.navZone .arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:40px; height:40px; border-radius:50%;
  background:rgba(0,0,0,.35); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; opacity:0; transition:opacity .2s;
}
.navZone.left .arrow{ left:10px; } .navZone.right .arrow{ right:10px; }
.navZone:hover .arrow{ opacity:1; }

/* ---------- Footer ---------- */
#footer{
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:10px 18px 14px;
  transition:transform .35s ease, opacity .35s ease;
}
body.fs-hide #footer{ transform:translateY(110%); opacity:0; pointer-events:none; }
#pageCounter{ font-size:13px; color:var(--muted); min-width:120px; text-align:center; }
#pageSlider{ width:min(50vw, 420px); accent-color:var(--accent); }

#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--frame2); color:var(--text); border:1px solid var(--accent-dim);
  padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .3s, transform .3s; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.5);
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

input[type=file]{ display:none; }

@media (max-width:720px){
  h1#logo{ display:none; }
  .grp{ padding:0 4px; }
  #pageSlider{ width:40vw; }
}
</style>
</head>
<body data-fs="0">

<div id="toolbar">
  <h1 id="logo">📖 Bilderbuch</h1>

  <div class="grp">
    <button id="btnOpenFolder">📁 Ordner laden</button>
    <button id="btnResume" style="display:none;">↺ Fortsetzen</button>
    <span id="folderInfo"></span>
  </div>

  <div class="grp">
    <label class="small">Modus</label>
    <select id="modeSelect">
      <option value="double">Doppelseite</option>
      <option value="single">Einzelseite</option>
      <option value="span">Bild über 2 Seiten</option>
    </select>
  </div>

  <div class="grp">
    <label class="small">Stil</label>
    <button class="swatch sw-leder" data-theme="leder" title="Leder"></button>
    <button class="swatch sw-antik" data-theme="antik" title="Antik"></button>
    <button class="swatch sw-modern" data-theme="modern" title="Modern"></button>
    <button class="swatch sw-nacht" data-theme="nacht" title="Nacht"></button>
  </div>

  <div class="grp">
    <button id="btnExportHtml">💾 Buch speichern</button>
    <button id="btnFullscreen">⛶ Vollbild</button>
  </div>
</div>

<div id="stageWrap">
  <div id="dropHint">
    <h2>Kein Buch geöffnet</h2>
    <p>Lade einen Ordner mit Bildern, um dein Buch zu erstellen.</p>
    <button id="btnOpenFolder2">📁 Ordner auswählen</button>
    <p style="font-size:11px;opacity:.6;max-width:340px;">Unterstützt: JPG, PNG, GIF, WEBP, BMP, AVIF — Reihenfolge nach Dateinamen.</p>
  </div>

  <div id="book" class="hidden">
    <div id="frame">
      <div id="pages" class="mode-double">
        <div class="pageHalf" id="leftPage"></div>
        <div id="gutter"></div>
        <div class="pageHalf" id="rightPage"></div>
        <div class="navZone left"><div class="arrow">‹</div></div>
        <div class="navZone right"><div class="arrow">›</div></div>
      </div>
    </div>
  </div>
</div>

<div id="footer">
  <button id="btnPrev">‹ Zurück</button>
  <span id="pageCounter">– / –</span>
  <input id="pageSlider" type="range" min="0" max="0" value="0" disabled>
  <button id="btnNext">Weiter ›</button>
</div>

<div id="toast"></div>

<input type="file" id="fileInputFallback" webkitdirectory multiple>

<script>
(() => {
  // captured before any dynamic changes — used as the template for HTML export
  const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  const $ = id => document.getElementById(id);
  const pagesEl=$('pages'), leftPageEl=$('leftPage'), rightPageEl=$('rightPage');
  const bookEl=$('book'), dropHint=$('dropHint');
  const pageCounter=$('pageCounter'), pageSlider=$('pageSlider');
  const folderInfo=$('folderInfo'), btnResume=$('btnResume');
  const toastEl=$('toast');

  let files = [];           // {name, url}
  let mode = 'double';       // single | double | span
  let theme = 'leder';
  let spreadIdx = 0;
  let animating = false;
  let folderName = '';
  let dirHandle = null;

  // ---------- helpers ----------
  const IMG_RE = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;
  function naturalSort(a,b){
    return a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'});
  }
  function toast(msg, ms=2200){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
  }

  // ---------- IndexedDB (handle + progress store) ----------
  let dbp = null;
  function idb(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('bilderbuch-viewer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idbSet(key,val){
    const db = await idb();
    return new Promise((res,rej)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(val,key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idb();
    return new Promise((res,rej)=>{
      const tx = db.transaction('kv','readonly');
      const rq = tx.objectStore('kv').get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }

  function lsKey(name){ return 'bbv-progress::' + name; }
  function saveProgress(silent){
    if(!folderName) return;
    localStorage.setItem(lsKey(folderName), JSON.stringify({ spreadIdx, mode, theme, total: files.length, savedAt: Date.now() }));
    if(!silent) toast('💾 Fortschritt gespeichert');
  }
  function loadProgressFor(name){
    try{
      const raw = localStorage.getItem(lsKey(name));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  // ---------- loading a folder ----------
  async function loadFromEntries(entries, name){
    files.forEach(f=>URL.revokeObjectURL(f.url));
    files = entries
      .filter(e => IMG_RE.test(e.name))
      .sort((a,b)=>naturalSort(a.name,b.name));
    folderName = name;
    folderInfo.textContent = `${name} · ${files.length} Bilder`;
    dropHint.classList.add('hidden');
    bookEl.classList.remove('hidden');

    const saved = loadProgressFor(name);
    if(saved && saved.total === files.length){
      mode = saved.mode || mode; theme = saved.theme || theme; spreadIdx = saved.spreadIdx || 0;
      $('modeSelect').value = mode;
      applyTheme(theme);
      toast('↺ Letzter Lesefortschritt wiederhergestellt');
    } else {
      spreadIdx = 0;
    }
    applyMode(mode, true);
  }

  async function readDirHandle(handle){
    const entries = [];
    for await (const [name, h] of handle.entries()){
      if(h.kind === 'file' && IMG_RE.test(name)){
        const file = await h.getFile();
        entries.push({ name, url: URL.createObjectURL(file), blob:file });
      }
    }
    return entries;
  }

  async function openViaPicker(){
    if(!('showDirectoryPicker' in window)){
      $('fileInputFallback').click();
      return;
    }
    try{
      const handle = await window.showDirectoryPicker();
      dirHandle = handle;
      const entries = await readDirHandle(handle);
      if(entries.length === 0){ toast('⚠️ Keine Bilder in diesem Ordner gefunden'); return; }
      await loadFromEntries(entries, handle.name);
      await idbSet('lastDir', handle);
      btnResume.style.display = 'none';
    }catch(err){
      if(err && err.name !== 'AbortError') console.error(err);
    }
  }

  $('fileInputFallback').addEventListener('change', async (e)=>{
    const list = Array.from(e.target.files || []).filter(f => IMG_RE.test(f.name));
    if(list.length === 0){ toast('⚠️ Keine Bilder in diesem Ordner gefunden'); return; }
    const entries = list.map(f => ({ name:f.webkitRelativePath || f.name, url: URL.createObjectURL(f), blob:f }));
    const folder = (list[0].webkitRelativePath || '').split('/')[0] || 'Ordner';
    await loadFromEntries(entries, folder);
  });

  async function tryResumeLastDir(){
    if(!('showDirectoryPicker' in window)) return;
    try{
      const handle = await idbGet('lastDir');
      if(!handle) return;
      btnResume.style.display = 'inline-block';
      btnResume.textContent = `↺ Fortsetzen: ${handle.name}`;
      btnResume.onclick = async () => {
        try{
          let perm = await handle.queryPermission({mode:'read'});
          if(perm !== 'granted') perm = await handle.requestPermission({mode:'read'});
          if(perm !== 'granted'){ toast('⚠️ Zugriff verweigert'); return; }
          dirHandle = handle;
          const entries = await readDirHandle(handle);
          if(entries.length === 0){ toast('⚠️ Keine Bilder gefunden'); return; }
          await loadFromEntries(entries, handle.name);
        }catch(err){ console.error(err); toast('⚠️ Ordner konnte nicht geöffnet werden'); }
      };
    }catch(e){ /* no persisted handle yet */ }
  }

  // ---------- embedded book (loaded from an exported HTML file) ----------
  function loadEmbedded(data){
    files = (data.images || []).map(im => ({ name: im.name, url: im.dataUrl }));
    folderName = data.folderName || 'Gespeichertes Buch';
    mode = data.mode || mode;
    theme = data.theme || theme;
    spreadIdx = data.spreadIdx || 0;
    if(data.readerOnly) document.body.classList.add('reader-mode');
    $('modeSelect').value = mode;
    applyTheme(theme);
    folderInfo.textContent = `${folderName} · ${files.length} Bilder`;
    dropHint.classList.add('hidden');
    bookEl.classList.remove('hidden');
    const mx = maxIndex();
    if(spreadIdx > mx) spreadIdx = mx;
    applyMode(mode, true);
  }

  function jsonForScript(obj){
    // avoid an embedded "</script" prematurely closing the injected script tag
    return JSON.stringify(obj).replace(/</g, '\\u003c');
  }

  // Saves the book as a new, lightweight HTML file for reading: no toolbar,
  // and images referenced by their filename (not embedded) — place the
  // exported file in the same folder as the images.
  function exportAsHtmlFile(){
    if(files.length === 0){ toast('⚠️ Kein Buch geladen'); return; }
    const images = files.map(f => ({ name: f.name, dataUrl: encodeURI(f.name) }));
    const payload = { images, mode, theme, spreadIdx, folderName: folderName || 'Mein Buch', readerOnly:true };
    const injected = `\n<script>window.__EMBEDDED_BOOK__=${jsonForScript(payload)};<\/script>\n`;
    const finalHtml = PRISTINE_HTML.replace(/<body([^>]*)>/, (m, attrs) => `<body${attrs}>${injected}`);
    const blobOut = new Blob([finalHtml], { type:'text/html' });
    const url = URL.createObjectURL(blobOut);
    const a = document.createElement('a');
    a.href = url;
    a.download = (folderName || 'buch').replace(/[^a-z0-9\-_]+/gi, '_') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('✅ Buch als HTML gespeichert — im selben Ordner wie die Bilder ablegen');
  }

  // ---------- spread computation ----------
  function maxIndex(){
    const n = files.length;
    if(n === 0) return 0;
    if(mode === 'double') return n <= 1 ? 0 : Math.ceil((n - 1) / 2);
    return n - 1; // single / span
  }
  function spreadFor(idx){
    const n = files.length;
    if(mode === 'double'){
      if(idx === 0) return { left:null, right: n>0 ? 0 : null };
      const l = 2*idx - 1, r = 2*idx;
      return { left: l < n ? l : null, right: r < n ? r : null };
    }
    if(mode === 'span'){
      return { span: idx < n ? idx : null };
    }
    return { single: idx < n ? idx : null };
  }
  function halfHTML(i, blankLabel){
    if(i === null || i === undefined) return `<div class="pageHalf blank"></div>`;
    return `<div class="pageHalf"><img src="${files[i].url}" alt="Seite ${i+1}" draggable="false"></div>`;
  }
  function buildContentEl(idx){
    const wrap = document.createElement('div');
    wrap.className = 'leafInner';
    const sp = spreadFor(idx);
    if(mode === 'double'){
      wrap.innerHTML = halfHTML(sp.left) + `<div class="gutterMini" style="position:absolute;top:0;bottom:0;left:50%;width:30px;transform:translateX(-50%);background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.3) 50%, rgba(0,0,0,0));pointer-events:none;"></div>` + halfHTML(sp.right);
    } else if(mode === 'span'){
      if(sp.span === null){ wrap.innerHTML = `<div class="pageHalf blank" style="flex:1"></div>`; }
      else{
        wrap.innerHTML = `<div class="pageHalf" style="flex:1;position:relative;">
          <img src="${files[sp.span].url}" style="width:100%;height:100%;object-fit:cover;" draggable="false">
          <div style="position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.35) 50%, rgba(0,0,0,0));"></div>
        </div>`;
      }
    } else {
      wrap.innerHTML = halfHTML(sp.single);
      wrap.style.justifyContent='center';
    }
    return wrap;
  }

  // ---------- rendering ----------
  function renderStatic(idx){
    pagesEl.querySelectorAll('.leaf').forEach(l=>l.remove());
    const sp = spreadFor(idx);
    if(mode === 'double'){
      leftPageEl.innerHTML = sp.left!==null ? `<img src="${files[sp.left].url}" draggable="false">` : '';
      leftPageEl.className = 'pageHalf' + (sp.left===null?' blank':'');
      rightPageEl.innerHTML = sp.right!==null ? `<img src="${files[sp.right].url}" draggable="false">` : '';
      rightPageEl.className = 'pageHalf' + (sp.right===null?' blank':'');
    } else if(mode === 'span'){
      const has = sp.span!==null;
      leftPageEl.style.display='none';
      $('gutter').style.display='none';
      rightPageEl.style.display='flex';
      rightPageEl.style.flex='1';
      rightPageEl.className = 'pageHalf' + (!has?' blank':'');
      rightPageEl.innerHTML = has ? `<img src="${files[sp.span].url}" style="object-fit:cover;" draggable="false"><div style="position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.35) 50%, rgba(0,0,0,0));"></div>` : '';
    } else {
      leftPageEl.style.display='none';
      $('gutter').style.display='none';
      rightPageEl.style.display='flex';
      rightPageEl.style.flex='1';
      const has = sp.single!==null;
      rightPageEl.className = 'pageHalf' + (!has?' blank':'');
      rightPageEl.innerHTML = has ? `<img src="${files[sp.single].url}" draggable="false">` : '';
    }
    updateFooter();
  }

  function applyMode(newMode, force){
    mode = newMode;
    pagesEl.className = 'mode-' + mode;
    if(mode === 'double'){
      leftPageEl.style.display='flex'; leftPageEl.style.flex='1';
      $('gutter').style.display='block';
    }
    const mx = maxIndex();
    if(spreadIdx > mx) spreadIdx = mx;
    renderStatic(spreadIdx);
  }

  function updateFooter(){
    const mx = maxIndex();
    pageSlider.max = mx;
    pageSlider.value = spreadIdx;
    pageSlider.disabled = files.length === 0;
    if(files.length === 0){ pageCounter.textContent = '– / –'; return; }
    const sp = spreadFor(spreadIdx);
    let label;
    if(mode==='double'){
      const l = sp.left!==null? sp.left+1:'–', r = sp.right!==null? sp.right+1:'–';
      label = `Seite ${l}–${r} von ${files.length}`;
    } else {
      const i = (sp.span ?? sp.single);
      label = `Bild ${i!==null? i+1 : '–'} von ${files.length}`;
    }
    pageCounter.textContent = label;
    $('btnPrev').disabled = spreadIdx <= 0;
    $('btnNext').disabled = spreadIdx >= mx;
    saveProgress(true);
  }

  // ---------- flip animation ----------
  function turn(dir){
    if(animating || files.length===0) return;
    const mx = maxIndex();
    const target = spreadIdx + dir;
    if(target < 0 || target > mx) return;
    animating = true;

    const outgoing = buildContentEl(spreadIdx);
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.appendChild(outgoing);

    if(dir > 0){
      leaf.style.transformOrigin = 'left center';
      leaf.style.transform = 'rotateY(0deg)';
      // show target underneath immediately
      spreadIdx = target;
      renderStatic(spreadIdx);
      pagesEl.appendChild(leaf);
      requestAnimationFrame(()=>{
        leaf.classList.add('animating');
        requestAnimationFrame(()=>{ leaf.style.transform = 'rotateY(-160deg)'; leaf.style.opacity = '0.85'; });
      });
    } else {
      // backward: show old (current) statically, animate the NEW (target) leaf sweeping in from the right
      const incoming = buildContentEl(target);
      leaf.innerHTML = '';
      leaf.appendChild(incoming);
      leaf.style.transformOrigin = 'right center';
      leaf.style.transform = 'rotateY(160deg)';
      pagesEl.appendChild(leaf);
      requestAnimationFrame(()=>{
        leaf.classList.add('animating');
        requestAnimationFrame(()=>{ leaf.style.transform = 'rotateY(0deg)'; });
      });
      leaf.addEventListener('transitionend', function done(){
        leaf.removeEventListener('transitionend', done);
        spreadIdx = target;
        renderStatic(spreadIdx);
        leaf.remove();
        animating = false;
      }, {once:true});
      return;
    }

    leaf.addEventListener('transitionend', function done(){
      leaf.removeEventListener('transitionend', done);
      leaf.remove();
      animating = false;
    }, {once:true});
    // safety fallback in case transitionend doesn't fire
    setTimeout(()=>{ if(leaf.parentNode){ leaf.remove(); animating=false; } }, 900);
  }

  function jumpTo(idx){
    if(animating) return;
    const mx = maxIndex();
    spreadIdx = Math.max(0, Math.min(mx, idx));
    renderStatic(spreadIdx);
  }

  // ---------- theme ----------
  function applyTheme(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s.dataset.theme===t));
    saveProgress(true);
  }

  // ---------- events ----------
  $('btnOpenFolder').addEventListener('click', openViaPicker);
  $('btnOpenFolder2').addEventListener('click', openViaPicker);
  $('btnPrev').addEventListener('click', ()=>turn(-1));
  $('btnNext').addEventListener('click', ()=>turn(1));
  $('modeSelect').addEventListener('change', e=>applyMode(e.target.value));
  document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click', ()=>applyTheme(s.dataset.theme)));
  $('btnExportHtml').addEventListener('click', exportAsHtmlFile);
  pageSlider.addEventListener('input', e=>jumpTo(parseInt(e.target.value,10)));

  pagesEl.querySelector('.navZone.left')?.addEventListener('click', ()=>turn(-1));
  pagesEl.querySelector('.navZone.right')?.addEventListener('click', ()=>turn(1));

  document.addEventListener('keydown', e=>{
    if(e.key === 'ArrowRight') turn(1);
    else if(e.key === 'ArrowLeft') turn(-1);
    else if(e.key.toLowerCase() === 'f') toggleFullscreen();
    else if(e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }
  $('btnFullscreen').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', ()=>{
    document.body.classList.toggle('fs-hide', false);
  });

  // auto-hide toolbar in fullscreen after inactivity
  let hideTimer;
  function scheduleHide(){
    clearTimeout(hideTimer);
    if(document.fullscreenElement){
      document.body.classList.remove('fs-hide');
      hideTimer = setTimeout(()=>document.body.classList.add('fs-hide'), 2600);
    }
  }
  document.addEventListener('mousemove', scheduleHide);
  document.addEventListener('fullscreenchange', scheduleHide);

  window.addEventListener('beforeunload', ()=>saveProgress(true));

  // init
  if(window.__EMBEDDED_BOOK__){
    loadEmbedded(window.__EMBEDDED_BOOK__);
  } else {
    applyTheme(theme);
    tryResumeLastDir();
  }
  updateFooter();
})();
</script>
</body>
</html>
