<style>
:root{
  --font-display:'Bebas Neue', sans-serif;
  --font-body:'Barlow', sans-serif;
}
html[data-theme="leder"]{
  --bg1:#120d0a; --bg2:#1e1611; --frame:#241a13; --frame2:#3a2a1c;
  --paper:#f4ead4; --paper2:#e9dcbf; --spine:#0a0704;
  --accent:#d4af37; --accent-dim:#9c7f2b; --text:#f4ead4; --muted:#c9b98f;
  --shadow: rgba(0,0,0,.65);
}
html[data-theme="antik"]{
  --bg1:#2c2117; --bg2:#3c2e1f; --frame:#4a3620; --frame2:#5f4527;
  --paper:#efe1c3; --paper2:#e3d1a8; --spine:#1c130b;
  --accent:#b5793a; --accent-dim:#8a5c2a; --text:#f1e6cc; --muted:#d8c6a0;
  --shadow: rgba(20,10,0,.55);
}
html[data-theme="modern"]{
  --bg1:#0a0a0c; --bg2:#131318; --frame:#1a1b20; --frame2:#26272e;
  --paper:#f6f6f8; --paper2:#eaeaee; --spine:#000;
  --accent:#c9c9d6; --accent-dim:#84848f; --text:#f2f2f5; --muted:#9a9aa5;
  --shadow: rgba(0,0,0,.7);
}
html[data-theme="nacht"]{
  --bg1:#000; --bg2:#08080a; --frame:#0e0e10; --frame2:#161618;
  --paper:#141412; --paper2:#0f0f0e; --spine:#000;
  --accent:#b8860b; --accent-dim:#7a5a09; --text:#e7d9b0; --muted:#8c7f5e;
  --shadow: rgba(0,0,0,.85);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font-body);
  background:radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg1) 75%);
  color:var(--text);
  display:flex; flex-direction:column;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
}

/* ---------- Toolbar ---------- */
#toolbar{
  display:flex; align-items:center; gap:14px;
  padding:10px 18px;
  background:linear-gradient(180deg, var(--frame2), var(--frame));
  border-bottom:2px solid var(--accent-dim);
  flex-wrap:wrap;
  z-index:50;
  transition:transform .35s ease, opacity .35s ease;
}
body.fs-hide #toolbar{ transform:translateY(-110%); opacity:0; pointer-events:none; }
body.reader-mode #toolbar{ display:none !important; }
body.reader-mode #stageWrap{ padding-top:26px; }

h1#logo{
  font-family:var(--font-display);
  letter-spacing:2px;
  font-size:22px;
  color:var(--accent);
  margin:0 8px 0 0;
  white-space:nowrap;
}
.grp{ display:flex; align-items:center; gap:6px; padding:0 8px; border-right:1px solid rgba(255,255,255,.08); }
.grp:last-child{ border-right:none; }
label.small{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-right:2px; }

button, select{
  font-family:var(--font-body); font-weight:600; font-size:13px;
  background:linear-gradient(180deg, var(--frame2), var(--frame));
  color:var(--text);
  border:1px solid var(--accent-dim);
  border-radius:6px;
  padding:7px 12px;
  cursor:pointer;
  transition:background .2s, transform .1s, border-color .2s;
  white-space:nowrap;
}
button:hover{ border-color:var(--accent); background:linear-gradient(180deg, var(--frame2), var(--frame2)); }
button:active{ transform:scale(.96); }
button.active{ background:var(--accent); color:var(--spine); border-color:var(--accent); }
button:disabled{ opacity:.35; cursor:default; }
select{ padding:7px 8px; }

.swatch{ width:26px; height:26px; padding:0; border-radius:50%; border:2px solid var(--accent-dim); position:relative; }
.swatch.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
.sw-leder{ background:linear-gradient(135deg,#3a2a1c,#f4ead4 60%,#d4af37); }
.sw-antik{ background:linear-gradient(135deg,#5f4527,#efe1c3 60%,#b5793a); }
.sw-modern{ background:linear-gradient(135deg,#1a1b20,#f6f6f8 60%,#c9c9d6); }
.sw-nacht{ background:linear-gradient(135deg,#000,#141412 55%,#b8860b); }

#folderInfo{ font-size:12px; color:var(--muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- Stage ---------- */
#stageWrap{
  flex:1; position:relative; display:flex; align-items:center; justify-content:center;
  padding:22px; min-height:0;
}
#dropHint{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; color:var(--muted); text-align:center; padding:20px;
}
#dropHint h2{ font-family:var(--font-display); letter-spacing:1px; color:var(--accent); font-weight:400; font-size:28px; margin:0; }
#dropHint.hidden{ display:none; }

#book{
  position:relative;
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
}
#book.hidden{ display:none; }

#frame{
  position:relative; width:100%; height:100%;
  background:linear-gradient(180deg, var(--frame2), var(--frame));
  border-radius:10px;
  box-shadow:0 30px 70px var(--shadow), inset 0 0 0 2px var(--accent-dim);
  padding:22px;
  display:flex; align-items:center; justify-content:center;
}

#bookContainer{ position:relative; }
#bookContainer .page{
  background-color:var(--paper);
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#bookContainer .page img{
  width:100%; height:100%; object-fit:contain; pointer-events:none; background:var(--paper);
}
#bookContainer .stf__parentItem{ box-shadow:0 10px 40px rgba(0,0,0,.5); }

/* ---------- Footer ---------- */
#footer{
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:10px 18px 14px;
  transition:transform .35s ease, opacity .35s ease;
}
body.fs-hide #footer{ transform:translateY(110%); opacity:0; pointer-events:none; }
#pageCounter{ font-size:13px; color:var(--muted); min-width:120px; text-align:center; }
#pageSlider{ width:min(50vw, 420px); accent-color:var(--accent); }

#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--frame2); color:var(--text); border:1px solid var(--accent-dim);
  padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .3s, transform .3s; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.5);
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

input[type=file]{ display:none; }

@media (max-width:720px){
  h1#logo{ display:none; }
  .grp{ padding:0 4px; }
  #pageSlider{ width:40vw; }
}
</style>

<script>window.__EMBEDDED_BOOK__={"images":[{"name":"Die Schattenkrieger-01.jpg","dataUrl":"Die%20Schattenkrieger-01.jpg"},{"name":"Die Schattenkrieger-02.jpg","dataUrl":"Die%20Schattenkrieger-02.jpg"},{"name":"Die Schattenkrieger-03.jpg","dataUrl":"Die%20Schattenkrieger-03.jpg"},{"name":"Die Schattenkrieger-04.jpg","dataUrl":"Die%20Schattenkrieger-04.jpg"},{"name":"Die Schattenkrieger-05.jpg","dataUrl":"Die%20Schattenkrieger-05.jpg"},{"name":"Die Schattenkrieger-06.jpg","dataUrl":"Die%20Schattenkrieger-06.jpg"},{"name":"Die Schattenkrieger-07.jpg","dataUrl":"Die%20Schattenkrieger-07.jpg"},{"name":"Die Schattenkrieger-08.jpg","dataUrl":"Die%20Schattenkrieger-08.jpg"},{"name":"Die Schattenkrieger-09.jpg","dataUrl":"Die%20Schattenkrieger-09.jpg"},{"name":"Die Schattenkrieger-10.jpg","dataUrl":"Die%20Schattenkrieger-10.jpg"},{"name":"Die Schattenkrieger-11.jpg","dataUrl":"Die%20Schattenkrieger-11.jpg"},{"name":"Die Schattenkrieger-12.jpg","dataUrl":"Die%20Schattenkrieger-12.jpg"}],"mode":"span","theme":"leder","spreadIdx":15,"folderName":"Die_Schattenkrieger","readerOnly":true};</script>


<div id="toolbar">

<script>
(() => {
  // captured before any dynamic changes — used as the template for HTML export
  const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  const $ = id => document.getElementById(id);
  const bookContainerEl=$('bookContainer');
  const bookEl=$('book'), dropHint=$('dropHint'), stageWrapEl=$('stageWrap');
  const pageCounter=$('pageCounter'), pageSlider=$('pageSlider');
  const folderInfo=$('folderInfo'), btnResume=$('btnResume');
  const toastEl=$('toast');

  let files = [];            // {name, url, blob}
  let mode = 'double';        // single | double | span
  let theme = 'leder';
  let spreadIdx = 0;          // current page index (StPageFlip page index)
  let folderName = '';
  let dirHandle = null;
  let pageFlip = null;
  let building = false;

  // ---------- helpers ----------
  const IMG_RE = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;
  function naturalSort(a,b){
    return a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'});
  }
  function toast(msg, ms=2200){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
  }

  // ---------- IndexedDB (handle + progress store) ----------
  let dbp = null;
  function idb(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('bilderbuch-viewer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idbSet(key,val){
    const db = await idb();
    return new Promise((res,rej)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(val,key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idb();
    return new Promise((res,rej)=>{
      const tx = db.transaction('kv','readonly');
      const rq = tx.objectStore('kv').get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }

  function lsKey(name){ return 'bbv-progress::' + name; }
  function saveProgress(silent){
    if(!folderName) return;
    localStorage.setItem(lsKey(folderName), JSON.stringify({ spreadIdx, mode, theme, total: files.length, savedAt: Date.now() }));
    if(!silent) toast('💾 Fortschritt gespeichert');
  }
  function loadProgressFor(name){
    try{
      const raw = localStorage.getItem(lsKey(name));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  // ---------- loading a folder ----------
  async function loadFromEntries(entries, name){
    files.forEach(f=>{ if(f.url && f.url.startsWith('blob:')) URL.revokeObjectURL(f.url); });
    files = entries
      .filter(e => IMG_RE.test(e.name))
      .sort((a,b)=>naturalSort(a.name,b.name));
    folderName = name;
    folderInfo.textContent = `${name} · ${files.length} Bilder`;
    dropHint.classList.add('hidden');
    bookEl.classList.remove('hidden');

    const saved = loadProgressFor(name);
    if(saved && saved.total === files.length){
      mode = saved.mode || mode; theme = saved.theme || theme; spreadIdx = saved.spreadIdx || 0;
      $('modeSelect').value = mode;
      applyTheme(theme);
      toast('↺ Letzter Lesefortschritt wiederhergestellt');
    } else {
      spreadIdx = 0;
    }
    await buildBook();
  }

  async function readDirHandle(handle){
    const entries = [];
    for await (const [name, h] of handle.entries()){
      if(h.kind === 'file' && IMG_RE.test(name)){
        const file = await h.getFile();
        entries.push({ name, url: URL.createObjectURL(file), blob:file });
      }
    }
    return entries;
  }

  async function openViaPicker(){
    if(!('showDirectoryPicker' in window)){
      $('fileInputFallback').click();
      return;
    }
    try{
      const handle = await window.showDirectoryPicker();
      dirHandle = handle;
      const entries = await readDirHandle(handle);
      if(entries.length === 0){ toast('⚠️ Keine Bilder in diesem Ordner gefunden'); return; }
      await loadFromEntries(entries, handle.name);
      await idbSet('lastDir', handle);
      btnResume.style.display = 'none';
    }catch(err){
      if(err && err.name !== 'AbortError') console.error(err);
    }
  }

  $('fileInputFallback').addEventListener('change', async (e)=>{
    const list = Array.from(e.target.files || []).filter(f => IMG_RE.test(f.name));
    if(list.length === 0){ toast('⚠️ Keine Bilder in diesem Ordner gefunden'); return; }
    const entries = list.map(f => ({ name:f.webkitRelativePath || f.name, url: URL.createObjectURL(f), blob:f }));
    const folder = (list[0].webkitRelativePath || '').split('/')[0] || 'Ordner';
    await loadFromEntries(entries, folder);
  });

  async function tryResumeLastDir(){
    if(!('showDirectoryPicker' in window)) return;
    try{
      const handle = await idbGet('lastDir');
      if(!handle) return;
      btnResume.style.display = 'inline-block';
      btnResume.textContent = `↺ Fortsetzen: ${handle.name}`;
      btnResume.onclick = async () => {
        try{
          let perm = await handle.queryPermission({mode:'read'});
          if(perm !== 'granted') perm = await handle.requestPermission({mode:'read'});
          if(perm !== 'granted'){ toast('⚠️ Zugriff verweigert'); return; }
          dirHandle = handle;
          const entries = await readDirHandle(handle);
          if(entries.length === 0){ toast('⚠️ Keine Bilder gefunden'); return; }
          await loadFromEntries(entries, handle.name);
        }catch(err){ console.error(err); toast('⚠️ Ordner konnte nicht geöffnet werden'); }
      };
    }catch(e){ /* no persisted handle yet */ }
  }

  // ---------- embedded book (loaded from an exported HTML file) ----------
  async function loadEmbedded(data){
    files = (data.images || []).map(im => ({ name: im.name, url: im.dataUrl }));
    folderName = data.folderName || 'Gespeichertes Buch';
    mode = data.mode || mode;
    theme = data.theme || theme;
    spreadIdx = data.spreadIdx || 0;
    if(data.readerOnly) document.body.classList.add('reader-mode');
    $('modeSelect').value = mode;
    applyTheme(theme);
    folderInfo.textContent = `${folderName} · ${files.length} Bilder`;
    dropHint.classList.add('hidden');
    bookEl.classList.remove('hidden');
    await buildBook();
  }

  function jsonForScript(obj){
    // avoid an embedded "</script" prematurely closing the injected script tag
    return JSON.stringify(obj).replace(/</g, '\\u003c');
  }

  // Saves the book as a new, lightweight HTML file for reading: no toolbar,
  // and images referenced by their filename (not embedded) — place the
  // exported file in the same folder as the images.
  function exportAsHtmlFile(){
    if(files.length === 0){ toast('⚠️ Kein Buch geladen'); return; }
    const images = files.map(f => ({ name: f.name, dataUrl: encodeURI(f.name) }));
    const payload = { images, mode, theme, spreadIdx, folderName: folderName || 'Mein Buch', readerOnly:true };
    const injected = `\n<script>window.__EMBEDDED_BOOK__=${jsonForScript(payload)};<\/script>\n`;
    const finalHtml = PRISTINE_HTML.replace(/<body([^>]*)>/, (m, attrs) => `<body${attrs}>${injected}`);
    const blobOut = new Blob([finalHtml], { type:'text/html' });
    const url = URL.createObjectURL(blobOut);
    const a = document.createElement('a');
    a.href = url;
    a.download = (folderName || 'buch').replace(/[^a-z0-9\-_]+/gi, '_') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('✅ Buch als HTML gespeichert — im selben Ordner wie die Bilder ablegen');
  }

  // ---------- image helpers ----------
  function preload(src){
    return new Promise((resolve,reject)=>{
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = src;
    });
  }
  function splitImageInHalf(url){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = () => {
        const hw = Math.floor(img.width/2), h = img.height;
        const cl = document.createElement('canvas'); cl.width=hw; cl.height=h;
        cl.getContext('2d').drawImage(img,0,0,hw,h,0,0,hw,h);
        const cr = document.createElement('canvas'); cr.width=hw; cr.height=h;
        cr.getContext('2d').drawImage(img,hw,0,hw,h,0,0,hw,h);
        resolve([cl.toDataURL('image/jpeg',0.92), cr.toDataURL('image/jpeg',0.92)]);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // ---------- book building (StPageFlip — realistic page-turn animation) ----------
  async function buildBook(){
    if(files.length === 0 || building) return;
    building = true;
    try{
      if(pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip = null; }
      bookContainerEl.innerHTML = '';

      let pageSources;
      if(mode === 'span'){
        pageSources = [];
        for(const f of files){
          const [l,r] = await splitImageInHalf(f.url);
          pageSources.push(l, r);
        }
      } else {
        pageSources = files.map(f => f.url);
      }
      if(pageSources.length === 0){ building=false; return; }

      pageSources.forEach(src=>{
        const div = document.createElement('div');
        div.className = 'page';
        const img = document.createElement('img');
        img.src = src; img.draggable = false;
        div.appendChild(img);
        bookContainerEl.appendChild(div);
      });

      const firstImg = await preload(pageSources[0]);
      const stageRect = stageWrapEl.getBoundingClientRect();
      const viewportWidth = Math.max(200, stageRect.width * 0.92);
      const viewportHeight = Math.max(200, stageRect.height * 0.92);
      const imgW = firstImg.naturalWidth || 600, imgH = firstImg.naturalHeight || 800;
      const isSingleLayout = (mode === 'single');
      const perPageWidth = isSingleLayout ? viewportWidth : viewportWidth / 2;
      const ratio = Math.min(perPageWidth / imgW, viewportHeight / imgH);
      const bw = Math.max(200, Math.round(imgW * ratio));
      const bh = Math.max(260, Math.round(imgH * ratio));

      pageFlip = new St.PageFlip(bookContainerEl, {
        width: bw, height: bh, size:'fixed',
        minWidth:200, maxWidth:1600, minHeight:250, maxHeight:2200,
        maxShadowOpacity:0.5,
        showCover: !isSingleLayout,
        mobileScrollSupport:false,
        usePortrait: isSingleLayout,
        singlePageMode: isSingleLayout,
        drawShadow:true,
        flippingTime:700
      });
      pageFlip.loadFromHTML(bookContainerEl.querySelectorAll('.page'));

      const total = pageFlip.getPageCount();
      if(spreadIdx > total-1) spreadIdx = Math.max(0, total-1);
      if(spreadIdx > 0) pageFlip.turnToPage(spreadIdx);

      pageFlip.on('flip', (e)=>{ spreadIdx = e.data; updateFooter(); });
    }catch(err){
      console.error(err);
      toast('⚠️ Buch konnte nicht aufgebaut werden');
    }
    building = false;
    updateFooter();
  }

  function updateFooter(){
    if(!pageFlip || files.length === 0){
      pageCounter.textContent = '– / –';
      pageSlider.disabled = true;
      $('btnPrev').disabled = true; $('btnNext').disabled = true;
      return;
    }
    const cur = pageFlip.getCurrentPageIndex();
    const total = pageFlip.getPageCount();
    pageCounter.textContent = `Seite ${cur+1} / ${total}`;
    pageSlider.max = Math.max(0, total-1);
    pageSlider.value = cur;
    pageSlider.disabled = false;
    $('btnPrev').disabled = cur <= 0;
    $('btnNext').disabled = cur >= total-1;
    saveProgress(true);
  }

  // ---------- theme ----------
  function applyTheme(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s.dataset.theme===t));
    saveProgress(true);
  }

  // ---------- events ----------
  $('btnOpenFolder').addEventListener('click', openViaPicker);
  $('btnOpenFolder2').addEventListener('click', openViaPicker);
  $('btnPrev').addEventListener('click', ()=>{ pageFlip && pageFlip.flipPrev(); });
  $('btnNext').addEventListener('click', ()=>{ pageFlip && pageFlip.flipNext(); });
  $('modeSelect').addEventListener('change', e=>{ mode = e.target.value; buildBook(); });
  document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click', ()=>applyTheme(s.dataset.theme)));
  $('btnExportHtml').addEventListener('click', exportAsHtmlFile);
  pageSlider.addEventListener('input', e=>{
    if(!pageFlip) return;
    pageFlip.turnToPage(parseInt(e.target.value,10));
    spreadIdx = pageFlip.getCurrentPageIndex();
    updateFooter();
  });

  document.addEventListener('keydown', e=>{
    if(!pageFlip) return;
    if(e.key === 'ArrowRight') pageFlip.flipNext();
    else if(e.key === 'ArrowLeft') pageFlip.flipPrev();
    else if(e.key.toLowerCase() === 'f') toggleFullscreen();
    else if(e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }
  $('btnFullscreen').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', ()=>{
    document.body.classList.toggle('fs-hide', false);
    scheduleRebuild();
  });

  // rebuild (re-size) the book after resize / fullscreen change, preserving current page
  let rebuildTimer;
  function scheduleRebuild(){
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(()=>{ if(files.length) buildBook(); }, 300);
  }
  window.addEventListener('resize', scheduleRebuild);

  // auto-hide toolbar in fullscreen after inactivity
  let hideTimer;
  function scheduleHide(){
    clearTimeout(hideTimer);
    if(document.fullscreenElement){
      document.body.classList.remove('fs-hide');
      hideTimer = setTimeout(()=>document.body.classList.add('fs-hide'), 2600);
    }
  }
  document.addEventListener('mousemove', scheduleHide);
  document.addEventListener('fullscreenchange', scheduleHide);

  window.addEventListener('beforeunload', ()=>saveProgress(true));

  // init
  if(window.__EMBEDDED_BOOK__){
    loadEmbedded(window.__EMBEDDED_BOOK__);
  } else {
    applyTheme(theme);
    tryResumeLastDir();
  }
  updateFooter();
})();
</script></body></html>
