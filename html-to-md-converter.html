<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML → Markdown Konverter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.js"></script>

<style>
  :root{
    --bg: #0e0d0b;
    --bg-alt: #161410;
    --panel: #1a1712;
    --panel-2: #201c15;
    --border: #35301f;
    --gold: #d4af37;
    --gold-bright: #f0c96a;
    --gold-dim: #8a7635;
    --text: #eee7d6;
    --text-dim: #a89f8a;
    --danger: #b3543f;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html,body{
    height:100%;
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
  }

  #app{
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 15% 0%, rgba(212,175,55,0.06), transparent 45%),
      var(--bg);
  }

  header{
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 22px;
    background: var(--bg-alt);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }

  h1{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:2px;
    font-size:1.7rem;
    color: var(--gold-bright);
    margin:0;
    white-space:nowrap;
  }

  h1 span{ color: var(--text-dim); font-size:1rem; font-family:'Barlow Semi Condensed', sans-serif; letter-spacing:1px; display:block; margin-top:-2px; }

  .spacer{ flex:1; }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: var(--panel);
    border:1px solid var(--border);
    color: var(--text);
    padding:9px 14px;
    border-radius: var(--radius);
    font-family:'Barlow Semi Condensed', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.4px;
    cursor:pointer;
    transition: all 0.15s ease;
    text-transform:uppercase;
  }

  .btn:hover{
    border-color: var(--gold-dim);
    color: var(--gold-bright);
    background: var(--panel-2);
  }

  .btn.primary{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1a1508;
    border-color: var(--gold);
  }
  .btn.primary:hover{ filter:brightness(1.08); color:#1a1508; }

  .btn.active{
    border-color: var(--gold);
    color: var(--gold-bright);
    box-shadow: inset 0 0 0 1px var(--gold-dim);
  }

  toolbar, #toolbar{
    display:flex;
    align-items:center;
    gap:4px;
    padding:10px 22px;
    background: var(--panel);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }

  .tbtn{
    background: var(--panel-2);
    border:1px solid var(--border);
    color: var(--text);
    width:36px;
    height:34px;
    border-radius:7px;
    cursor:pointer;
    font-size:0.95rem;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.12s ease;
    font-family:'Barlow', sans-serif;
  }
  .tbtn:hover{ border-color: var(--gold-dim); color: var(--gold-bright); }
  .tbtn.wide{ width:auto; padding:0 12px; font-size:0.78rem; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; font-family:'Barlow Semi Condensed', sans-serif; }
  .tsep{ width:1px; align-self:stretch; background: var(--border); margin:2px 8px; }

  main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap:1px;
    background: var(--border);
    overflow:hidden;
  }

  main.with-preview{ grid-template-columns: 1fr 1fr 1fr; }

  .pane{
    background: var(--bg);
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    overflow:hidden;
  }

  .pane-head{
    padding:9px 18px;
    font-family:'Barlow Semi Condensed', sans-serif;
    font-size:0.75rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--gold-dim);
    background: var(--bg-alt);
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .pane-head .copy{
    cursor:pointer;
    color: var(--text-dim);
    font-size:0.7rem;
    text-transform:none;
    letter-spacing:0.3px;
  }
  .pane-head .copy:hover{ color: var(--gold-bright); }

  #editor{
    flex:1;
    min-height:0;
    padding:24px 28px;
    overflow-y:auto;
    outline:none;
    line-height:1.65;
    font-size:1.02rem;
  }

  #editor h1,#editor h2,#editor h3{ font-family:'Bebas Neue', sans-serif; letter-spacing:1px; color: var(--gold-bright); }
  #editor h1{ font-size:2rem; }
  #editor h2{ font-size:1.55rem; }
  #editor h3{ font-size:1.25rem; }
  #editor a{ color: var(--gold); }
  #editor blockquote{ border-left:3px solid var(--gold-dim); margin:10px 0; padding:4px 16px; color: var(--text-dim); }
  #editor code{ background: var(--panel-2); padding:2px 6px; border-radius:5px; font-family:'JetBrains Mono', monospace; font-size:0.9em; }
  #editor pre{ background: var(--panel-2); padding:12px 16px; border-radius:8px; overflow-x:auto; border:1px solid var(--border); }
  #editor pre code{ background:none; padding:0; }
  #editor hr{ border:none; border-top:1px solid var(--border); margin:18px 0; }
  #editor img{ max-width:100%; border-radius:6px; }
  #editor:empty:before{ content: attr(data-placeholder); color: var(--text-dim); }

  #mdOutput{
    flex:1;
    background: var(--bg);
    color: var(--text);
    border:none;
    outline:none;
    resize:none;
    padding:24px 28px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.88rem;
    line-height:1.6;
    white-space:pre-wrap;
  }

  #previewPane{
    flex:1;
    min-height:0;
    padding:24px 28px;
    overflow-y:auto;
    line-height:1.65;
  }
  #previewPane h1,#previewPane h2,#previewPane h3{ font-family:'Bebas Neue', sans-serif; color: var(--gold-bright); letter-spacing:1px; }
  #previewPane blockquote{ border-left:3px solid var(--gold-dim); margin:10px 0; padding:4px 16px; color: var(--text-dim); }
  #previewPane code{ background: var(--panel-2); padding:2px 6px; border-radius:5px; font-family:'JetBrains Mono', monospace; font-size:0.9em; }
  #previewPane pre{ background: var(--panel-2); padding:12px 16px; border-radius:8px; overflow-x:auto; border:1px solid var(--border); }
  #previewPane pre code{ background:none; }

  footer{
    padding:6px 22px;
    background: var(--bg-alt);
    border-top:1px solid var(--border);
    color: var(--text-dim);
    font-size:0.72rem;
    font-family:'Barlow Semi Condensed', sans-serif;
    letter-spacing:0.4px;
    display:flex;
    justify-content:space-between;
  }

  #app:fullscreen{ background: var(--bg); }
  #app:fullscreen main{ height:100%; }

  input[type=file]{ display:none; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: var(--bg); }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--gold-dim); }

  @media (max-width: 860px){
    main, main.with-preview{ grid-template-columns: 1fr; grid-auto-rows: minmax(200px, 1fr); }
  }

  .toast{
    position:fixed;
    bottom:22px;
    right:22px;
    background: var(--panel);
    border:1px solid var(--gold-dim);
    color: var(--gold-bright);
    padding:10px 18px;
    border-radius: var(--radius);
    font-family:'Barlow Semi Condensed', sans-serif;
    font-size:0.85rem;
    letter-spacing:0.3px;
    opacity:0;
    transform: translateY(8px);
    transition: all 0.25s ease;
    pointer-events:none;
    z-index:999;
  }
  .toast.show{ opacity:1; transform: translateY(0); }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>HTML → MD<span>Konverter &amp; Formel-Editor</span></h1>
    <div class="spacer"></div>
    <button class="btn" id="btnLoad">📂 Laden</button>
    <input type="file" id="fileInput" accept=".html,.htm,.md,.markdown,.txt">
    <button class="btn" id="btnSaveMd">⬇ Als .md</button>
    <button class="btn" id="btnSaveHtml">⬇ Als .html</button>
    <button class="btn" id="btnPreview">👁 Vorschau</button>
    <button class="btn primary" id="btnFullscreen">⛶ Vollbild</button>
  </header>

  <div id="toolbar">
    <button class="tbtn" data-cmd="bold" title="Fett"><b>B</b></button>
    <button class="tbtn" data-cmd="italic" title="Kursiv"><i>I</i></button>
    <button class="tbtn" data-cmd="underline" title="Unterstrichen"><u>U</u></button>
    <button class="tbtn" data-cmd="strikeThrough" title="Durchgestrichen"><s>S</s></button>
    <div class="tsep"></div>
    <button class="tbtn wide" data-block="H1">H1</button>
    <button class="tbtn wide" data-block="H2">H2</button>
    <button class="tbtn wide" data-block="H3">H3</button>
    <button class="tbtn wide" data-block="P">Text</button>
    <div class="tsep"></div>
    <button class="tbtn" data-cmd="insertUnorderedList" title="Liste">• ―</button>
    <button class="tbtn" data-cmd="insertOrderedList" title="Nummerierte Liste">1.</button>
    <button class="tbtn wide" data-block="BLOCKQUOTE" title="Zitat">❝ Zitat</button>
    <button class="tbtn wide" data-block="PRE" title="Codeblock">&lt;/&gt; Code</button>
    <div class="tsep"></div>
    <button class="tbtn" id="btnLink" title="Link einfügen">🔗</button>
    <button class="tbtn" id="btnImg" title="Bild einfügen">🖼</button>
    <button class="tbtn" id="btnHr" title="Trennlinie">―</button>
    <div class="tsep"></div>
    <button class="tbtn wide" id="btnFormulaInline" title="Inline-Formel">$ Formel</button>
    <button class="tbtn wide" id="btnFormulaBlock" title="Block-Formel">$$ Formel</button>
    <div class="tsep"></div>
    <button class="tbtn" id="btnClear" title="Editor leeren">🗑</button>
  </div>

  <main id="main">
    <div class="pane">
      <div class="pane-head">Editor <span></span></div>
      <div id="editor" contenteditable="true" data-placeholder="Text hier einfügen oder tippen … LaTeX z.B. $E=mc^2$ oder $$\int_0^1 x^2\,dx$$"></div>
    </div>
    <div class="pane">
      <div class="pane-head">Markdown <span class="copy" id="btnCopy">Kopieren</span></div>
      <textarea id="mdOutput" spellcheck="false"></textarea>
    </div>
    <div class="pane" id="previewPaneWrap" style="display:none;">
      <div class="pane-head">Vorschau (mit LaTeX)</div>
      <div id="previewPane"></div>
    </div>
  </main>

  <footer>
    <span id="statusText">Bereit.</span>
    <span>Turndown · MathJax</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const editor = document.getElementById('editor');
const mdOutput = document.getElementById('mdOutput');
const previewPane = document.getElementById('previewPane');
const previewWrap = document.getElementById('previewPaneWrap');
const mainEl = document.getElementById('main');
const fileInput = document.getElementById('fileInput');
const toast = document.getElementById('toast');
const statusText = document.getElementById('statusText');

let previewOn = false;
let previewTimer = null;

// --- Turndown Setup ---
const td = new TurndownService({
  headingStyle: 'atx',
  codeBlockStyle: 'fenced',
  bulletListMarker: '-',
  emDelimiter: '*'
});

// LaTeX-Ausdrücke ($...$, $$...$$) unverändert als Text durchreichen
td.addRule('preserveLatex', {
  filter: function (node) {
    return node.nodeType === 3 && /\$.+\$/.test(node.textContent || '');
  },
  replacement: function (content) { return content; }
});

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove('show'), 2200);
}

function convert(){
  const md = td.turndown(editor.innerHTML);
  mdOutput.value = md;
  statusText.textContent = md.length + ' Zeichen konvertiert';
  if(previewOn) schedulePreview();
}

function schedulePreview(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(()=>{
    previewPane.innerHTML = editor.innerHTML;
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([previewPane]).catch(()=>{});
    }
  }, 250);
}

editor.addEventListener('input', convert);
editor.addEventListener('blur', convert);

// --- Toolbar ---
document.querySelectorAll('.tbtn[data-cmd]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    editor.focus();
    document.execCommand(btn.dataset.cmd, false, null);
    convert();
  });
});

document.querySelectorAll('.tbtn[data-block]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    editor.focus();
    document.execCommand('formatBlock', false, btn.dataset.block);
    convert();
  });
});

document.getElementById('btnLink').addEventListener('click', ()=>{
  const url = prompt('Link-URL:', 'https://');
  if(url){ editor.focus(); document.execCommand('createLink', false, url); convert(); }
});

document.getElementById('btnImg').addEventListener('click', ()=>{
  const url = prompt('Bild-URL:', 'https://');
  if(url){ editor.focus(); document.execCommand('insertImage', false, url); convert(); }
});

document.getElementById('btnHr').addEventListener('click', ()=>{
  editor.focus(); document.execCommand('insertHorizontalRule', false, null); convert();
});

function insertTextAtCursor(text){
  editor.focus();
  const sel = window.getSelection();
  if(!sel.rangeCount){ editor.appendChild(document.createTextNode(text)); convert(); return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.setEndAfter(node);
  sel.removeAllRanges();
  sel.addRange(range);
  convert();
}

document.getElementById('btnFormulaInline').addEventListener('click', ()=>{
  const f = prompt('Inline-Formel (LaTeX), z.B. E=mc^2', 'x^2 + y^2 = z^2');
  if(f) insertTextAtCursor('$' + f + '$');
});

document.getElementById('btnFormulaBlock').addEventListener('click', ()=>{
  const f = prompt('Block-Formel (LaTeX), z.B. \\int_0^1 x^2\\,dx', '\\int_0^1 x^2\\,dx');
  if(f) insertTextAtCursor('$$' + f + '$$');
});

document.getElementById('btnClear').addEventListener('click', ()=>{
  if(confirm('Editor wirklich leeren?')){
    editor.innerHTML = '';
    convert();
  }
});

// --- Vorschau toggeln ---
document.getElementById('btnPreview').addEventListener('click', (e)=>{
  previewOn = !previewOn;
  e.target.classList.toggle('active', previewOn);
  previewWrap.style.display = previewOn ? 'flex' : 'none';
  mainEl.classList.toggle('with-preview', previewOn);
  if(previewOn) schedulePreview();
});

// --- Vollbild ---
document.getElementById('btnFullscreen').addEventListener('click', ()=>{
  const app = document.getElementById('app');
  if(!document.fullscreenElement){
    app.requestFullscreen().catch(()=> showToast('Vollbild nicht verfügbar'));
  } else {
    document.exitFullscreen();
  }
});

// --- Kopieren ---
document.getElementById('btnCopy').addEventListener('click', ()=>{
  navigator.clipboard.writeText(mdOutput.value).then(()=> showToast('Markdown kopiert ✓'));
});

// --- Laden ---
document.getElementById('btnLoad').addEventListener('click', ()=> fileInput.click());

fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const content = reader.result;
    const name = file.name.toLowerCase();
    if(name.endsWith('.md') || name.endsWith('.markdown') || name.endsWith('.txt')){
      editor.innerHTML = simpleMarkdownToHtml(content);
    } else {
      // HTML laden: nur Body-Inhalt übernehmen falls vollständiges Dokument
      const parser = new DOMParser();
      const doc = parser.parseFromString(content, 'text/html');
      editor.innerHTML = doc.body ? doc.body.innerHTML : content;
    }
    convert();
    showToast('"' + file.name + '" geladen ✓');
  };
  reader.readAsText(file, 'UTF-8');
  fileInput.value = '';
});

// Minimaler Markdown → HTML Parser für den Ladevorgang (.md Dateien)
function simpleMarkdownToHtml(md){
  let html = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.*)$/gim, '<h3>$1</h3>')
    .replace(/^## (.*)$/gim, '<h2>$1</h2>')
    .replace(/^# (.*)$/gim, '<h1>$1</h1>')
    .replace(/^&gt; (.*)$/gim, '<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^-{3,}$/gim, '<hr>')
    .replace(/^- (.*)$/gim, '<li>$1</li>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  html = html.split(/\n{2,}/).map(block=>{
    if(/^<(h1|h2|h3|ul|blockquote|hr)/.test(block.trim())) return block;
    if(block.trim() === '') return '';
    return '<p>' + block.replace(/\n/g,'<br>') + '</p>';
  }).join('\n');
  return html;
}

// --- Speichern ---
function download(filename, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

document.getElementById('btnSaveMd').addEventListener('click', ()=>{
  convert();
  download('dokument.md', mdOutput.value, 'text/markdown');
  showToast('Markdown gespeichert ✓');
});

document.getElementById('btnSaveHtml').addEventListener('click', ()=>{
  const fullHtml = `<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dokument</title>
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\\\(', '\\\\)']],
      displayMath: [['$$', '$$'], ['\\\\[', '\\\\]']]
    },
    svg: { fontCache: 'global' }
  };
<\/script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>
<style>
  body{ font-family: sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; line-height:1.6; color:#1a1a1a; }
  blockquote{ border-left:3px solid #ccc; padding-left:14px; color:#555; }
  code{ background:#f2f2f2; padding:2px 6px; border-radius:4px; }
  pre{ background:#f2f2f2; padding:12px 16px; border-radius:8px; overflow-x:auto; }
  img{ max-width:100%; }
</style>
</head>
<body>
${editor.innerHTML}
</body>
</html>`;
  download('dokument.html', fullHtml, 'text/html');
  showToast('HTML gespeichert ✓');
});

// Initial
editor.innerHTML = '<h1>Willkommen</h1><p>Tippe oder füge HTML-Inhalt ein. Nutze die Formel-Buttons für <strong>LaTeX</strong>, z.B. $E = mc^2$ oder als Block:</p><p>$$\\int_0^1 x^2\\,dx = \\frac{1}{3}$$</p>';
convert();
</script>
</body>
</html>
